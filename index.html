      const hitRadius = PLAYER.radius + enemy.radius * 0.88;
      if (dx * dx + dy * dy > hitRadius * hitRadius) continue;

      const stompActive =
        INPUT.stompDashActive &&
        PLAYER.vy > 0 &&
        PLAYER.y <= enemy.y + enemy.radius * 0.7;

      // Successful stomp remains unchanged.
      if (stompActive) {
        INPUT.stompDashActive = false;
        INPUT.stompDashTimer = 0;
        INPUT.stompFragileBroken = false;
        INPUT.stompTargetId = null;
        squashEnemy(enemy);
        return;
      }

      // Normal microbe contact is non-lethal.
      if (STATE.time < (enemy.contactCooldownUntil || 0)) {
        continue;
      }
      enemy.contactCooldownUntil = STATE.time + 0.30;

      let pushDir = Math.sign(dx);
      if (pushDir === 0) {
        pushDir = Math.sign(PLAYER.visualVX) || -enemy.patrolDir || 1;
      }

      // Small bounce-back away from the microbe.
      PLAYER.vx = pushDir * 185;
      PLAYER.targetX = clamp(
        PLAYER.targetX + pushDir * 5,
        PLAYER.radius,
        W - PLAYER.radius
      );

      // Avoid sticky overlap without giving stomp-height bounce.
      if (PLAYER.vy > 40) {
        PLAYER.vy = Math.min(PLAYER.vy, 150);
      }

      // Miss-level penalty only: combo is lost, run continues.
      STATE.combo = 0;
      STATE.multiplier = 1;
      updateHUD();

      // Neutral contact particles, clearly different from stomp effect.
      ParticleSys.spawn(
        enemy.x + pushDir * enemy.radius * 0.45,
        enemy.y - enemy.radius * 0.10,
        {
          count: 7,
          color: "#b8b5a7",
          speedMin: 18,
          speedMax: 58,
          lift: 18,
          lifeMin: 0.16,
          lifeMax: 0.30,
          sizeMin: 1.2,
          sizeMax: 2.6
        }
      );

      PLAYER.squash = Math.max(PLAYER.squash, 0.08);
      STATE.impactShake = Math.max(STATE.impactShake, 0.45);
      AudioSys.contact();

      // One reaction per frame is enough.
      return;
    }
  }

  function recordFlickSample(clientY, timeStamp) {
    const now = Number.isFinite(timeStamp) ? timeStamp : performance.now();
    const samples = INPUT.flickSamples;

    const lastSample = samples.length ? samples[samples.length - 1] : null;
    if (lastSample) {
      const dtMs = Math.max(8, now - lastSample.t);
      const dyStep = clientY - INPUT.flickLastY;
      const instantVY = dyStep / (dtMs / 1000);

      if (dyStep > 0.6) {
        INPUT.flickAccumDown += dyStep;
      } else {
        INPUT.flickAccumDown *= 0.92;
      }

      INPUT.flickSmoothedVY =
        INPUT.flickSmoothedVY * 0.68 + instantVY * 0.32;
    }

    INPUT.flickLastY = clientY;
    samples.push({ y: clientY, t: now });

    const cutoff = now - CONFIG.controls.flickWindowMs;
    while (samples.length > 2 && samples[0].t < cutoff) {
      samples.shift();
    }

    if (samples.length < 2) return;

    const first = samples[0];
    const last = samples[samples.length - 1];
    const dtMs = Math.max(16, last.t - first.t);
    const deltaY = last.y - first.y;
    const verticalVelocity = deltaY / (dtMs / 1000);

    const cooldownReady =
      now - INPUT.lastFlickAt >= CONFIG.controls.flickCooldownMs;

    const classicFlick =
      deltaY >= CONFIG.controls.flickMinTravel &&
      verticalVelocity >= CONFIG.controls.flickThreshold;

    const smoothMobileFlick =
      IS_MOBILE &&
      INPUT.flickAccumDown >= CONFIG.controls.mobileAccumTravel &&
      INPUT.flickSmoothedVY >= CONFIG.controls.mobileSwipeVelocity;

    const intentFlick =
      IS_MOBILE &&
      deltaY >= CONFIG.controls.mobileSwipeTravel &&
      dtMs <= CONFIG.controls.mobileSwipeMaxMs &&
      (
        verticalVelocity >= CONFIG.controls.mobileSwipeVelocity ||
        INPUT.flickSmoothedVY >= CONFIG.controls.mobileSwipeVelocity
      );

    if (
      cooldownReady &&
      !INPUT.flickTriggeredForPointer &&
      (classicFlick || smoothMobileFlick || intentFlick)
    ) {
      INPUT.flickTriggeredForPointer = true;
      INPUT.lastFlickAt = now;
      INPUT.flickAccumDown = 0;
      INPUT.flickSmoothedVY = 0;
      samples.length = 0;
      samples.push({ y: clientY, t: now });
      triggerDownFlick();
    }
  }

  // ============================================================
  // 10) NEAR MISS
  // ============================================================
  function checkNearMisses() {
    if (STATE.time < STATE.nearMissCooldownUntil) return;

    for (const p of STATE.platforms) {
      if (p.type !== TYPE.SPIKE || p.nearMissGranted) continue;

      // Player platformun dikey seviyesini geçmiş ama çarpmamışsa,
      // sol/sağ kenara yakınlığa bak.
      const playerBottom = PLAYER.y + PLAYER.radius;

      if (playerBottom < p.y - 6 || playerBottom > p.y + 48) continue;

      const leftDistance = Math.abs(PLAYER.x - (p.x - PLAYER.radius));
      const rightDistance = Math.abs(PLAYER.x - (p.x + p.w + PLAYER.radius));
      const nearDistance = Math.min(leftDistance, rightDistance);

      if (nearDistance <= PLAYER.radius * 2.5) {
        p.nearMissGranted = true;
        STATE.nearMissCooldownUntil = STATE.time + 0.65;

        STATE.score += 50;
        STATE.combo += 2;

        STATE.speedPulse = 0.12;
        STATE.impactShake = Math.max(STATE.impactShake, 1.2);
        popup("NEAR MISS!", PLAYER.x, PLAYER.y - 20, "good");
        burst(PLAYER.x, PLAYER.y, 7);
        AudioSys.perfect();
        updateHUD();

        break;
      }
    }
  }

  // ============================================================
  // 11) SKOR + COMBO LOSS
  // ============================================================
  function updateScore(dt) {
    STATE.multiplier = comboMultiplier();

    // Score starts calm and becomes faster as the game itself speeds up.
    // This keeps the first part readable instead of racing through numbers.
    const scoreSpeed01 = clamp((STATE.scrollSpeed - 205) / (292 - 205), 0, 1);
    const scoreRamp = Math.pow(scoreSpeed01, 1.35);
    const scorePerSecond = lerp(5.2, 19.5, scoreRamp);

    STATE.score +=
      scorePerSecond *
      dt *
      STATE.multiplier;

    STATE.runDistance += STATE.scrollSpeed * dt;

    // Smooth acceleration, then a permanent fixed-speed plateau.
    // Once the player reaches the plateau, the run never gets faster.
    const START_SPEED = 205;
    const MAX_SPEED = 292;
    const PLATEAU_SCORE = 2600;

    if (STATE.score >= PLATEAU_SCORE) {
      STATE.scrollSpeed = MAX_SPEED;
    } else {
      const normalized = clamp(STATE.score / PLATEAU_SCORE, 0, 1);

      // Smoothstep gives a soft ramp with no sudden jumps.
      const eased = normalized * normalized * (3 - 2 * normalized);
      STATE.scrollSpeed = START_SPEED + (MAX_SPEED - START_SPEED) * eased;
    }

    STATE.impactShake *= Math.max(0, 1 - 14 * dt);
    STATE.speedPulse = Math.max(0, STATE.speedPulse - dt);
    STATE.landingFlash = Math.max(0, STATE.landingFlash - dt);

    PLAYER.squash *= Math.max(0, 1 - 13 * dt);
    const verticalStretchTarget = clamp(Math.abs(PLAYER.vy) / 760, 0, 1) * 0.10;
    PLAYER.stretch += (verticalStretchTarget - PLAYER.stretch) * Math.min(1, 9 * dt);

    if (
      STATE.combo > 0 &&
      STATE.lastLandingPlatformY !== null &&
      PLAYER.y - STATE.lastLandingPlatformY > 190
    ) {
      resetCombo();
      popup("COMBO LOST", PLAYER.x, PLAYER.y - 20, "bad");
      STATE.lastLandingPlatformY = PLAYER.y;
    }

    if (STATE.score > STATE.best) {
      STATE.best = STATE.score;
    }

    updateHUD();
  }

  // ============================================================
  // 12) FIXED UPDATE
  // ============================================================
  function fixedUpdate(dt) {
    if (STATE.mode === MODE.TUTORIAL) {
      if (STATE.windEvent) finishWindEvent();

      STATE.time += dt;
      STATE.tutorialTime += dt;

      // suspended ball with gentle breathing only
      PLAYER.prevX = PLAYER.x;
      PLAYER.prevY = PLAYER.y;

      // Keep the ball centered during tutorial, but preserve targetX so its
      // eyes can follow the direction the user drags before starting.
      PLAYER.x = W * 0.5;
      PLAYER.y = (IS_MOBILE ? Math.min(H * 0.29, 320) : H * 0.34) + Math.sin(STATE.tutorialTime * 2.3) * 4;

      updateTheme(dt);
      updateParticles(dt);
      updatePopups(dt);
      return;
    }

    if (STATE.mode === MODE.DEATH) {
      if (STATE.windEvent || STATE.windVisual) finishWindEvent();
      updateDeath(dt);
      return;
    }

    if (STATE.mode === MODE.REVIVE) {
      updateRevive(dt);
      return;
    }

    if (STATE.mode === MODE.REVIVE_COUNTDOWN) {
      updateReviveCountdown(dt);
      return;
    }

    if (STATE.mode !== MODE.PLAYING) {
      if (STATE.windEvent) finishWindEvent();
      updateParticles(dt);
      updatePopups(dt);
      return;
    }

    STATE.time += dt;
    if (STATE.invincibleTimer > 0) {
      STATE.invincibleTimer = Math.max(0, STATE.invincibleTimer - dt);
    }
    updateTheme(dt);

    // PHASE-1 — Enemy stomp is NOT automatic anymore.
    // Normal platform collision always runs; flick is an independent input event.
    updatePlatforms(dt);
    updateEnemies(dt);
    updatePlayer(dt);

    // STRICT VOID RULE:
    // The instant the ball's bottom edge touches the screen bottom line,
    // death wins before any platform collision can save the player.
    if (PLAYER.y + PLAYER.radius >= H) {
      INPUT.stompDashActive = false;
      INPUT.stompDashTimer = 0;
      INPUT.stompFragileBroken = false;
      INPUT.stompTargetId = null;

      PLAYER.x = clamp(PLAYER.x, PLAYER.radius + 2, W - PLAYER.radius - 2);
      PLAYER.y = H - PLAYER.radius;
      PLAYER.prevY = PLAYER.y;
      PLAYER.vy = 0;

      beginDeath("You fell into the void.");
      updateParticles(dt);
      updatePopups(dt);
      return;
    }

    sweptPlatformCollision();

    // Living microbe contact is now non-lethal.
    // Stomp still destroys the microbe; normal contact only recoils + resets combo.
    checkEnemyContact();

    if (STATE.mode !== MODE.PLAYING) {
      updateParticles(dt);
      updatePopups(dt);
      return;
    }

    checkNearMisses();
    updateScore(dt);
    updateParticles(dt);
    updatePopups(dt);

    // Fixed top spike hazard.
    if (PLAYER.y - PLAYER.radius <= 22) {
      beginDeath("You hit the ceiling spikes.");
      return;
    }


  }

  // ============================================================
  // 13) ÇİZİM
  // ============================================================
  function addRoundRectToPath(path, x, y, w, h, r) {
    const rr = Math.min(r, w * 0.5, h * 0.5);
    path.moveTo(x + rr, y);
    path.arcTo(x + w, y, x + w, y + h, rr);
    path.arcTo(x + w, y + h, x, y + h, rr);
    path.arcTo(x, y + h, x, y, rr);
    path.arcTo(x, y, x + w, y, rr);
    path.closePath();
  }

  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawBackground() {
    const T = mixedTheme();

    // Hard render-state reset every frame. Temporary effects can never
    // tint later frames after they finish.
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.lineCap = "butt";
    ctx.setLineDash([]);

    ctx.fillStyle = T.bg;
    ctx.fillRect(0, 0, W, H);

    // Paper grain / ruled motion
    const lineRgb = hexToRgb(THEMES[STATE.themeToIndex].line);
    ctx.strokeStyle = `rgba(${lineRgb.r},${lineRgb.g},${lineRgb.b},0.09)`;
    ctx.lineWidth = 1;

    const offset = (STATE.runDistance * 0.24) % 42;
    for (let y = -42 + offset; y < H + 42; y += 42) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // Speed streaks
    if (STATE.mode === MODE.PLAYING) {
      const speed01 = clamp((STATE.scrollSpeed - 205) / 87, 0, 1);
      const pulse = STATE.speedPulse > 0 ? 0.12 : 0;

      ctx.strokeStyle = `rgba(${lineRgb.r},${lineRgb.g},${lineRgb.b},${0.025 + speed01 * 0.055 + pulse * 0.5})`;
      ctx.lineWidth = 1.5;

      for (let i = 0; i < 9; i++) {
        const x = 18 + ((i * 61 + 31) % (W - 36));
        const speed = 0.72 + (i % 4) * 0.12;
        const y = (STATE.runDistance * speed + i * 103) % (H + 120) - 60;
        const len = 20 + speed01 * 38 + (i % 3) * 8;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - len);
        ctx.stroke();
      }
    }

    // No full-screen white landing flash.
    // Dark themes used to visibly "blink" white on every landing.
    ctx.globalAlpha = 1;
  }

  function drawPlatforms() {
    const T = mixedTheme();

    // Draw every platform with its own small wobble/tilt transform.
    for (const p of STATE.platforms) {
      if (p.broken) continue;

      const visualSink = p.impact * 4.2;
      const tilt = clamp(p.wobble * 0.09, -0.14, 0.14);
      const bounceY = p.bounce * 2.5 + visualSink;
      const cx = p.x + p.w * 0.5;
      const cy = p.y + p.h * 0.5;

      if (p.type !== TYPE.SPIKE) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(tilt);
        ctx.translate(-cx, -cy + bounceY);

        ctx.fillStyle =
          p.type === TYPE.NORMAL ? T.normal :
          p.type === TYPE.MOVING ? T.moving :
          T.fragile;

        ctx.strokeStyle = "#2f3833";
        ctx.lineWidth = 2;

        roundRectPath(p.x, p.y, p.w, Math.max(8, p.h - visualSink * 0.35), 6);
        ctx.fill();

        if (p.type === TYPE.FRAGILE) {
          ctx.setLineDash([6, 5]);
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          ctx.stroke();
        }

        if (p.type === TYPE.FRAGILE && p.fragileTriggered) {
          ctx.strokeStyle = "#6b4a35";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(p.x + p.w * 0.24, p.y + 1);
          ctx.lineTo(p.x + p.w * 0.37, p.y + p.h - 1);
          ctx.lineTo(p.x + p.w * 0.49, p.y + 3);
          ctx.lineTo(p.x + p.w * 0.62, p.y + p.h - 2);
          ctx.lineTo(p.x + p.w * 0.76, p.y + 2);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // Broken fragile debris
    for (const p of STATE.platforms) {
      if (!p.broken || p.type !== TYPE.FRAGILE || !p.breakPieces) continue;

      for (const q of p.breakPieces) {
        if (q.alpha <= 0.02) continue;

        ctx.save();
        ctx.globalAlpha = q.alpha;
        ctx.translate(q.x + q.w * 0.5, q.y + q.h * 0.5);
        ctx.rotate(q.rot);
        ctx.fillStyle = mixedTheme().fragile;
        ctx.strokeStyle = "rgba(47,56,51,.75)";
        ctx.lineWidth = 1.8;
        roundRectPath(-q.w * 0.5, -q.h * 0.5, q.w, q.h, 3);
        ctx.fill();
        ctx.stroke();

        // Tiny dusty softness under the piece as it disappears.
        ctx.globalAlpha = q.alpha * 0.18;
        ctx.fillStyle = "#8e7b66";
        ctx.beginPath();
        ctx.ellipse(0, q.h * 0.35, q.w * 0.42, q.h * 0.18, 0, 0, TAU);
        ctx.fill();

        ctx.restore();
      }
    }

    // Laser platforms: solid base + neon beam + glow particles.
    for (const p of STATE.platforms) {
      if (p.type !== TYPE.SPIKE || p.broken) continue;

      const tilt = clamp(p.wobble * 0.09, -0.14, 0.14);
      const bounceY = p.bounce * 2.2;
      const cx = p.x + p.w * 0.5;
      const cy = p.y + p.h * 0.5;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(tilt);
      ctx.translate(-cx, -cy + bounceY);

      // Base
      ctx.fillStyle = "#6d7378";
      ctx.strokeStyle = "#2f3833";
      ctx.lineWidth = 2;
      roundRectPath(p.x, p.y, p.w, p.h, 6);
      ctx.fill();
      ctx.stroke();

      // Emitter caps
      const emitterW = 11;
      const emitterH = 8;
      ctx.fillStyle = "#41484d";
      roundRectPath(p.x + 5, p.y - 5, emitterW, emitterH, 3);
      ctx.fill();
      roundRectPath(p.x + p.w - emitterW - 5, p.y - 5, emitterW, emitterH, 3);
      ctx.fill();

      // Neon beam with layered glow
      const beamX = p.x + 14;
      const beamW = Math.max(14, p.w - 28);
      const beamY = p.y - 3.5;

      const pulse = 0.72 + 0.28 * Math.sin(STATE.time * 12 + p.x * 0.05);

      ctx.lineCap = "round";

      // Outer glow
      ctx.globalAlpha = 0.18 + pulse * 0.10;
      ctx.strokeStyle = "#ff3a46";
      ctx.lineWidth = 13;
      ctx.beginPath();
      ctx.moveTo(beamX, beamY);
      ctx.lineTo(beamX + beamW, beamY);
      ctx.stroke();

      // Mid glow
      ctx.globalAlpha = 0.38 + pulse * 0.14;
      ctx.strokeStyle = "#ff4b55";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(beamX, beamY);
      ctx.lineTo(beamX + beamW, beamY);
      ctx.stroke();

      // Core beam
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#ffd6d8";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(beamX, beamY);
      ctx.lineTo(beamX + beamW, beamY);
      ctx.stroke();

      // Spark / heat particles
      for (let i = 0; i < 5; i++) {
        const tx = beamX + ((i * 37 + p.x * 0.3 + STATE.time * 75) % beamW);
        const ty = beamY - 2 - ((i * 11 + STATE.time * 26) % 10);
        const s = 1.7 + (i % 2) * 0.8;

        ctx.globalAlpha = 0.35 + (i % 3) * 0.12;
        ctx.fillStyle = i % 2 === 0 ? "#ff6c73" : "#ffd7da";
        ctx.beginPath();
        ctx.arc(tx, ty, s, 0, TAU);
        ctx.fill();
      }

      ctx.restore();
    }

    ctx.globalAlpha = 1;
  }


  // MİKROP GÖRSELİ / PATROL ANİMASYONU / EZİLME FADE
  function drawEnemies() {
    for (const enemy of STATE.enemies) {
      if (!enemy.active && !enemy.squashed) continue;

      const dying = enemy.squashed;
      const deathT = dying
        ? clamp(enemy.squashTimer / enemy.squashDuration, 0, 1)
        : 0;

      const r = enemy.radius;

      // Keep body visually anchored to the platform surface.
      const walkPhase = enemy.age * 8.2;
      const walkBob = dying ? 0 : Math.sin(walkPhase) * 1.15;
      const walkLean = dying ? 0 : enemy.patrolDir * Math.sin(walkPhase * 0.5) * 0.035;

      ctx.save();
      ctx.translate(enemy.x, enemy.y + walkBob);
      ctx.rotate(walkLean);

      // ------------------------------------------------------
      // Death: creature SHATTERS into chunks and dust instead of
      // flattening/burning. All fragments remain anchored relative
      // to the moving host platform because they are drawn from the
      // current platform-following enemy origin each frame.
      // ------------------------------------------------------
      if (dying) {
        // Small impact burst
        if (deathT < 0.34) {
          const ringT = deathT / 0.34;
          ctx.globalAlpha = (1 - ringT) * 0.38;
          ctx.strokeStyle = "#d9c97a";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.ellipse(
            0,
            r * 0.28,
            r * (0.55 + ringT * 1.00),
            r * (0.16 + ringT * 0.34),
            0,
            0,
            TAU
          );
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        const pieceFade = clamp(1 - deathT * 1.02, 0, 1);

        // Main body chunks
        for (let i = 0; i < 7; i++) {
          const a = enemy.burnSeed * 0.02 + i * (TAU / 7);
          const burst = deathT * (r * 0.80 + i * 1.7);
          const driftX = Math.cos(a) * burst;
          const driftY = Math.sin(a) * burst * 0.55 - deathT * (6 + i * 0.8);

          ctx.save();
          ctx.translate(driftX, driftY);
          ctx.rotate((enemy.burnSeed * 0.001 + i * 0.23) + deathT * (1.8 + i * 0.22));
          ctx.scale(1 - deathT * 0.18, 1 - deathT * 0.22);

          ctx.globalAlpha = pieceFade * 0.96;
          ctx.fillStyle = i % 2 === 0 ? "#6f8f65" : "#765f8b";
          ctx.strokeStyle = "#2b3030";
          ctx.lineWidth = 1.5;

          ctx.beginPath();
          ctx.moveTo(-r * 0.12, -r * 0.10);
          ctx.lineTo(r * 0.13, -r * 0.15);
          ctx.lineTo(r * 0.18, r * 0.03);
          ctx.lineTo(-r * 0.02, r * 0.18);
          ctx.lineTo(-r * 0.16, r * 0.05);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.restore();
        }

        // Spike / detail fragments
        for (let i = 0; i < 5; i++) {
          const a = enemy.burnSeed * 0.03 + i * 1.15 + 0.4;
          const burst = deathT * (r * 1.05 + i * 1.6);
          const x = Math.cos(a) * burst;
          const y = Math.sin(a) * burst * 0.52 - deathT * (8 + i * 1.2);

          ctx.globalAlpha = pieceFade * 0.82;
          ctx.fillStyle = i % 2 ? "#7b638d" : "#6f8f65";
          ctx.beginPath();
          ctx.moveTo(x, y - 3.5);
          ctx.lineTo(x + 2.8, y + 2.5);
          ctx.lineTo(x - 2.8, y + 2.5);
          ctx.closePath();
          ctx.fill();
        }

        // Dust cloud / powder
        for (let i = 0; i < 12; i++) {
          const a = enemy.burnSeed * 0.01 + i * 0.77;
          const spread = deathT * (r * 0.95 + (i % 4) * 2.2);
          const x = Math.cos(a) * spread;
          const y = r * 0.28 + Math.sin(a) * spread * 0.25 - deathT * 2.8;

          ctx.globalAlpha = pieceFade * (0.22 + (i % 3) * 0.05);
          ctx.fillStyle = i % 2 ? "#646964" : "#8d927d";
          ctx.beginPath();
          ctx.arc(x, y, 1.5 + (i % 4) * 0.55 + deathT * 0.5, 0, TAU);
          ctx.fill();
        }

        // A couple of eye dots among the fragments make the death feel creature-like.
        if (deathT < 0.72) {
          ctx.globalAlpha = pieceFade * 0.95;
          ctx.fillStyle = "#fffdf3";
          ctx.beginPath();
          ctx.arc(-r * 0.14 - deathT * 5.5, -r * 0.02 - deathT * 5.0, r * 0.10, 0, TAU);
          ctx.arc(r * 0.16 + deathT * 4.8, -r * 0.03 - deathT * 4.2, r * 0.10, 0, TAU);
          ctx.fill();

          ctx.fillStyle = "#24282a";
          ctx.beginPath();
          ctx.arc(-r * 0.14 - deathT * 5.5, -r * 0.02 - deathT * 5.0, r * 0.038, 0, TAU);
          ctx.arc(r * 0.16 + deathT * 4.8, -r * 0.03 - deathT * 4.2, r * 0.038, 0, TAU);
          ctx.fill();
        }

        ctx.restore();
        continue;
      }

      const bodySquash = 1 + Math.sin(walkPhase + 1.15) * 0.045;
      const bodyStretch = 1 - Math.sin(walkPhase + 1.15) * 0.022;
      ctx.scale(bodyStretch, bodySquash);

      // ------------------------------------------------------
      // Feet / suction pads: creature visibly sits ON platform.
      // ------------------------------------------------------
      ctx.fillStyle = "#4e6047";
      ctx.strokeStyle = "#2c3130";
      ctx.lineWidth = 1.7;

      const footLift = Math.sin(walkPhase) * 0.8;

      ctx.beginPath();
      ctx.ellipse(
        -r * 0.42,
        r * 0.57 + Math.max(0, footLift),
        r * 0.26,
        r * 0.13,
        -0.08,
        0,
        TAU
      );
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(
        r * 0.42,
        r * 0.57 + Math.max(0, -footLift),
        r * 0.26,
        r * 0.13,
        0.08,
        0,
        TAU
      );
      ctx.fill();
      ctx.stroke();

      // ------------------------------------------------------
      // Tentacle arms behind the body.
      // ------------------------------------------------------
      ctx.strokeStyle = "#556f51";
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";

      const armSwing = Math.sin(walkPhase) * 2.1;

      ctx.beginPath();
      ctx.moveTo(-r * 0.66, -r * 0.02);
      ctx.quadraticCurveTo(
        -r * 1.02,
        -r * 0.10 + armSwing,
        -r * 1.10,
        r * 0.20 + armSwing * 0.35
      );
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(r * 0.66, -r * 0.02);
      ctx.quadraticCurveTo(
        r * 1.02,
        -r * 0.10 - armSwing,
        r * 1.10,
        r * 0.20 - armSwing * 0.35
      );
      ctx.stroke();

      // ------------------------------------------------------
      // Main organic body.
      // ------------------------------------------------------
      ctx.fillStyle = "#6f8f65";
      ctx.strokeStyle = "#2b3030";
      ctx.lineWidth = 2.3;

      ctx.beginPath();
      ctx.moveTo(-r * 0.86, r * 0.16);
      ctx.bezierCurveTo(
        -r * 0.96, -r * 0.34,
        -r * 0.55, -r * 0.77,
        -r * 0.08, -r * 0.70
      );
      ctx.bezierCurveTo(
        r * 0.48, -r * 0.82,
        r * 0.92, -r * 0.39,
        r * 0.88, r * 0.15
      );
      ctx.bezierCurveTo(
        r * 0.80, r * 0.58,
        r * 0.43, r * 0.69,
        0, r * 0.63
      );
      ctx.bezierCurveTo(
        -r * 0.42, r * 0.70,
        -r * 0.79, r * 0.55,
        -r * 0.86, r * 0.16
      );
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Crown spikes / hairs with little rounded bulbs.
      const spikes = [
        [-0.56, -0.60, -0.73, -1.02],
        [-0.18, -0.72, -0.24, -1.14],
        [ 0.20, -0.73,  0.23, -1.15],
        [ 0.56, -0.58,  0.73, -0.98],
      ];

      ctx.strokeStyle = "#516d4d";
      ctx.lineWidth = 2.1;
      for (const s of spikes) {
        ctx.beginPath();
        ctx.moveTo(r * s[0], r * s[1]);
        ctx.quadraticCurveTo(
          r * ((s[0] + s[2]) * 0.5),
          r * (s[3] * 0.90),
          r * s[2],
          r * s[3]
        );
        ctx.stroke();

        ctx.fillStyle = "#7b638d";
        ctx.beginPath();
        ctx.arc(r * s[2], r * s[3], r * 0.09, 0, TAU);
        ctx.fill();
      }

      // Spots / skin details.
      ctx.fillStyle = "#765f8b";
      ctx.beginPath();
      ctx.ellipse(-r * 0.54, r * 0.09, r * 0.18, r * 0.13, -0.3, 0, TAU);
      ctx.ellipse(r * 0.54, r * 0.17, r * 0.13, r * 0.17, 0.25, 0, TAU);
      ctx.ellipse(r * 0.06, r * 0.40, r * 0.11, r * 0.08, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,.15)";
      ctx.beginPath();
      ctx.ellipse(-r * 0.32, -r * 0.42, r * 0.22, r * 0.10, -0.3, 0, TAU);
      ctx.fill();

      // Face.
      const eyeLook = enemy.patrolDir * r * 0.065;
      const blink = Math.sin(enemy.age * 2.7 + enemy.burnSeed) > 0.94;

      ctx.strokeStyle = "#29302e";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-r * 0.48, -r * 0.32);
      ctx.lineTo(-r * 0.14, -r * 0.23);
      ctx.moveTo(r * 0.48, -r * 0.32);
      ctx.lineTo(r * 0.14, -r * 0.23);
      ctx.stroke();

      if (!blink) {
        ctx.fillStyle = "#fffdf3";
        ctx.beginPath();
        ctx.ellipse(-r * 0.27, -r * 0.10, r * 0.20, r * 0.23, 0, 0, TAU);
        ctx.ellipse(r * 0.27, -r * 0.10, r * 0.20, r * 0.23, 0, 0, TAU);
        ctx.fill();

        ctx.fillStyle = "#24282a";
        ctx.beginPath();
        ctx.arc(-r * 0.27 + eyeLook, -r * 0.06, r * 0.082, 0, TAU);
        ctx.arc(r * 0.27 + eyeLook, -r * 0.06, r * 0.082, 0, TAU);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-r * 0.24 + eyeLook, -r * 0.10, r * 0.028, 0, TAU);
        ctx.arc(r * 0.30 + eyeLook, -r * 0.10, r * 0.028, 0, TAU);
        ctx.fill();
      } else {
        ctx.strokeStyle = "#24282a";
        ctx.lineWidth = 1.7;
        ctx.beginPath();
        ctx.moveTo(-r * 0.43, -r * 0.08);
        ctx.lineTo(-r * 0.13, -r * 0.08);
        ctx.moveTo(r * 0.13, -r * 0.08);
        ctx.lineTo(r * 0.43, -r * 0.08);
        ctx.stroke();
      }

      // Dark mouth with two little teeth.
      ctx.fillStyle = "#382b35";
      ctx.beginPath();
      ctx.ellipse(0, r * 0.26, r * 0.30, r * 0.18, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#fff8e9";
      ctx.beginPath();
      ctx.moveTo(-r * 0.15, r * 0.13);
      ctx.lineTo(-r * 0.05, r * 0.28);
      ctx.lineTo(r * 0.01, r * 0.13);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(r * 0.08, r * 0.13);
      ctx.lineTo(r * 0.17, r * 0.28);
      ctx.lineTo(r * 0.23, r * 0.13);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#d9828f";
      ctx.beginPath();
      ctx.ellipse(0, r * 0.34, r * 0.14, r * 0.06, 0, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    ctx.globalAlpha = 1;
  }
  function drawWindZones() {
    const e = STATE.windEvent;
    if (!e) return;
    if (STATE.mode !== MODE.PLAYING) {
      finishWindEvent();
      return;
    }

    // Render guard: a finished/stale wind can never leave the blue overlay
    // stuck on screen even if a frame missed the normal cleanup.
    if (
      !Number.isFinite(e.timer) ||
      !Number.isFinite(e.endsAt) ||
      STATE.time >= e.endsAt ||
      (e.phase === "active" && e.timer >= e.activeDuration)
    ) {
      finishWindEvent();
      return;
    }

    ctx.save();

    if (e.phase === "warning") {
      // Softer anticipation: flashing red frame, not a full red screen.
      const pulse = 0.5 + 0.5 * Math.sin(e.timer * 9.5);

      ctx.globalAlpha = 0.18 + pulse * 0.24;
      ctx.strokeStyle = "#c64d48";
      ctx.lineWidth = 10 + pulse * 4;
      ctx.strokeRect(6, 6, W - 12, H - 12);

      // Warning sign
      ctx.globalAlpha = 0.95;
      const signX = W * 0.5;
      const signY = H * 0.31;
      const triR = 34;

      ctx.fillStyle = "#f3cf58";
      ctx.strokeStyle = "#303631";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(signX, signY - triR);
      ctx.lineTo(signX + triR, signY + triR * 0.8);
      ctx.lineTo(signX - triR, signY + triR * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#303631";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 34px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
      ctx.fillText("!", signX, signY + 6);

      ctx.font = "900 22px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
      ctx.fillStyle = "#b33f3a";
      ctx.fillText(
        e.dir > 0 ? "WIND  →" : "←  WIND",
        signX,
        signY + 72
      );

      ctx.restore();
      return;
    }

    // Active wind enters from the incoming side instead of appearing
    // everywhere at once, then travels out through the opposite side.
    const flow = windFlowEnvelope(e);
    if (flow.amount <= 0.001) {
      ctx.restore();
      return;
    }

    const dir = e.dir;
    const t = STATE.time;

    // Intro: reveal progressively from the source side.
    // dir > 0 means wind travels left -> right.
    const reveal = Math.max(0.03, flow.enter);
    const revealW = W * reveal;

    ctx.beginPath();
    if (dir > 0) {
      ctx.rect(0, 0, revealW, H);
    } else {
      ctx.rect(W - revealW, 0, revealW, H);
    }
    ctx.clip();

    // Outro: carry the entire gust field out through the destination side.
    const outroProgress = 1 - flow.exit;
    const exitOffset = dir * W * 0.34 * outroProgress;
    ctx.translate(exitOffset, 0);

    // Gentle global fade only near the end.
    ctx.globalAlpha = Math.max(0, flow.amount);
    ctx.strokeStyle = "rgba(108,136,145,.50)";
    ctx.fillStyle = "rgba(108,136,145,.38)";
    ctx.lineCap = "round";

    // Dense full-screen speed streaks.
    for (let row = 0; row < 22; row++) {
      const yy = 28 + row * ((H - 56) / 21);
      const speed = 115 + (row % 5) * 17;
      const travel = W + 220;
      const base = (t * speed + row * 79) % travel;
      const sourceLead = (1 - flow.enter) * 180;
      const x = dir > 0
        ? base - 110 - sourceLead
        : W - (base - 110) + sourceLead;
      const len = 58 + (row % 4) * 16;

      ctx.lineWidth = 2 + (row % 3) * 0.45;
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x + dir * len, yy);
      ctx.stroke();

      if (row % 3 === 0) {
        ctx.beginPath();
        ctx.moveTo(x + dir * len * 0.45, yy);
        ctx.quadraticCurveTo(
          x + dir * len * 0.67,
          yy - 6,
          x + dir * len * 0.88,
          yy
        );
        ctx.stroke();
      }
    }

    // Curved gust wisps make the wind direction readable at a glance.
    ctx.globalAlpha = 0.52;
    ctx.strokeStyle = "rgba(215,232,238,.84)";
    ctx.lineWidth = 2.2;

    for (let i = 0; i < 7; i++) {
      const speed = 92 + i * 13;
      const travel = W + 260;
      const base = (t * speed + i * 131) % travel;
      const sourceLead = (1 - flow.enter) * 210;
      const x = dir > 0
        ? base - 130 - sourceLead
        : W - (base - 130) + sourceLead;
      const y = 90 + ((i * 101 + t * 18) % (H - 180));
      const len = 80 + (i % 3) * 24;

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(
        x + dir * len * 0.28, y - 12,
        x + dir * len * 0.70, y + 12,
        x + dir * len, y
      );
      ctx.stroke();
    }

    // Paper scraps flying through the whole viewport.
    for (let i = 0; i < 9; i++) {
      const speed = 72 + i * 9;
      const travel = W + 160;
      const base = (t * speed + i * 113) % travel;
      const sourceLead = (1 - flow.enter) * 160;
      const x = dir > 0
        ? base - 80 - sourceLead
        : W - (base - 80) + sourceLead;
      const y = 50 + ((i * 97 + t * 22) % (H - 100));

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * (1.4 + i * 0.12) * dir + i);
      const s = 6 + (i % 3) * 2;
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    }

    // Small persistent direction marker while active.
    ctx.globalAlpha = 0.72 * flow.amount;
    ctx.fillStyle = "#b74743";
    ctx.textAlign = dir > 0 ? "left" : "right";
    ctx.textBaseline = "middle";
    ctx.font = "900 16px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
    if (dir > 0) ctx.fillText("WIND →", 14, H * 0.16);
    else ctx.fillText("← WIND", W - 14, H * 0.16);

    ctx.restore();
  }

  function drawTopSpikes() {
    ctx.save();

    // No gap at all between the canvas top edge and hazard.
    ctx.fillStyle = "#d85650";
    ctx.strokeStyle = "#2f3833";
    ctx.lineWidth = 2;

    const baseY = 0;
    const spikeDepth = 22;
    const sw = 28;

    for (let x = -2; x < W + sw; x += sw) {
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(x + sw * 0.5, spikeDepth);
      ctx.lineTo(x + sw, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // Solid thin top strip guarantees there is no visible background seam.
    ctx.fillStyle = "#d85650";
    ctx.fillRect(0, 0, W, 3);

    ctx.restore();
  }

  function drawDeathPieces() {
    if (STATE.mode !== MODE.DEATH || STATE.deathPhase !== 1) return;

    const T = mixedTheme();

    // Subtle expanding shock ring — no full-screen flash.
    if (STATE.deathTimer < 0.34) {
      const t = clamp(STATE.deathTimer / 0.34, 0, 1);
      ctx.save();
      ctx.globalAlpha = (1 - t) * 0.34;
      ctx.strokeStyle = T.playerStroke;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(
        PLAYER.x,
        PLAYER.y,
        PLAYER.radius * (1.0 + t * 1.75),
        0,
        TAU
      );
      ctx.stroke();
      ctx.restore();
    }

    for (const q of STATE.deathPieces) {
      if (q.alpha <= 0.01) continue;

      ctx.save();
      ctx.globalAlpha = q.alpha;
      ctx.translate(q.x, q.y);
      ctx.rotate(q.rot);
      ctx.scale(Math.max(0.2, q.scale), Math.max(0.2, q.scale));

      ctx.fillStyle = T.player;
      ctx.strokeStyle = T.playerStroke;
      ctx.lineWidth = 1.7;

      const x0 = Math.cos(q.a0) * q.r0;
      const y0 = Math.sin(q.a0) * q.r0;
      const x1 = Math.cos(q.a0) * q.r1;
      const y1 = Math.sin(q.a0) * q.r1;
      const x2 = Math.cos(q.a1) * q.r1;
      const y2 = Math.sin(q.a1) * q.r1;
      const x3 = Math.cos(q.a1) * q.r0;
      const y3 = Math.sin(q.a1) * q.r0;

      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      if (q.r0 > 0) ctx.lineTo(x3, y3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Tiny white edge highlight makes pieces read as bits of the ball.
      ctx.globalAlpha = q.alpha * 0.24;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.restore();
    }

    // Dust / paper flecks.
    for (const d of STATE.deathDust) {
      if (d.life <= 0) continue;
      const a = d.life / d.maxLife;

      ctx.save();
      ctx.globalAlpha = a * 0.48;
      ctx.fillStyle = T.playerStroke;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.size * (0.65 + a * 0.35), 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    if (STATE.mode === MODE.DEATH && STATE.deathPhase === 1) return;

    const horizontalMotion = PLAYER.x - PLAYER.prevX;
    const targetDelta = PLAYER.targetX - PLAYER.x;

    // Stronger and clearer directional read.
    const moveIntent = Math.abs(horizontalMotion) < 0.03 ? 0 : clamp(horizontalMotion / 3.4, -1, 1);
    const aimIntent = Math.abs(targetDelta) < 0.8 ? 0 : clamp(targetDelta / 22, -1, 1);
    const horizontalIntent = clamp(moveIntent * 0.65 + aimIntent * 0.75, -1, 1);

    const look = horizontalIntent * 7.4;
    const tilt = PLAYER.visualTilt + horizontalIntent * 0.035;

    const horizontalDeform = clamp(Math.abs(PLAYER.visualVX) / 1700, 0, 0.10);
    const flickVisual = INPUT.flickPulse;
    const sx =
      1 +
      PLAYER.squash * 0.18 -
      PLAYER.stretch * 0.08 +
      horizontalDeform * 0.45 +
      flickVisual * 0.08;
    const sy =
      1 -
      PLAYER.squash * 0.16 +
      PLAYER.stretch * 0.14 -
      horizontalDeform * 0.32 -
      flickVisual * 0.10;

    // Softer and more readable motion streaks.
    if (STATE.mode === MODE.PLAYING) {
      const trailStrength = clamp(
        (Math.abs(PLAYER.vy) - 240) / 470 +
        Math.abs(horizontalMotion) * 0.11 +
        Math.abs(PLAYER.windVX) / 650 +
        (INPUT.stompDashActive ? 0.42 : 0),
        0,
        0.72
      );

      if (trailStrength > 0.03) {
        ctx.save();
        ctx.globalAlpha = trailStrength * 0.22;
        ctx.strokeStyle = "#87a79d";
        ctx.lineWidth = 3.2;
        ctx.lineCap = "round";

        for (let i = 0; i < 3; i++) {
          const ox = (i - 1) * 8;
          const tail = 10 + i * 6;

          ctx.beginPath();
          ctx.moveTo(
            PLAYER.x + ox - horizontalIntent * 4,
            PLAYER.y - PLAYER.radius * 0.18
          );
          ctx.quadraticCurveTo(
            PLAYER.x + ox - horizontalIntent * 10,
            PLAYER.y - Math.sign(PLAYER.vy || 1) * (PLAYER.radius * 0.7),
            PLAYER.x + ox - horizontalIntent * 7,
            PLAYER.y - Math.sign(PLAYER.vy || 1) * (PLAYER.radius + tail)
          );
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    ctx.save();
    ctx.translate(PLAYER.x, PLAYER.y);
    ctx.rotate(tilt);
    ctx.scale(sx, sy);

    const T = mixedTheme();
    const faceColor = "#1d2320";

    // Outer ball
    ctx.fillStyle = T.player;
    ctx.strokeStyle = T.playerStroke;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, PLAYER.radius, 0, TAU);
    ctx.fill();
    ctx.stroke();

    // Soft inner ring
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.arc(-1.2, -1.2, PLAYER.radius - 4.4, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Soft highlights
    ctx.fillStyle = "rgba(255,255,255,.44)";
    ctx.beginPath();
    ctx.arc(-7, -8, 5.6, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-2, -12, 2.6, 0, TAU);
    ctx.fill();

    const fallingFast = PLAYER.vy > 390;
    const fallingVeryFast = PLAYER.vy > 560;
    const fallingExtreme = PLAYER.vy > 760;
    const angryStomp = INPUT.stompDashActive || INPUT.angryFaceTimer > 0;

    // Eyes open dramatically on long falls.
    const eyeYOffset = angryStomp ? -1.2 : (fallingExtreme ? -0.8 : (fallingFast ? -1.5 : -2.2));
    const eyeOuterW = angryStomp ? 5.8 : (fallingExtreme ? 6.6 : (fallingFast ? 5.4 : 4.7));
    const eyeOuterH = angryStomp ? 5.4 : (fallingExtreme ? 8.5 : (fallingVeryFast ? 6.9 : (fallingFast ? 6.1 : 5.5)));

    function drawEye(cx) {
      ctx.save();
      ctx.translate(cx + look * 0.35, eyeYOffset);
      ctx.scale(eyeOuterW / 4.2, eyeOuterH / 4.2);
      ctx.fillStyle = "#fffef9";
      ctx.beginPath();
      ctx.arc(0, 0, 4.2, 0, TAU);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = faceColor;
      ctx.beginPath();
      ctx.arc(
        cx + look,
        eyeYOffset + (angryStomp ? 1.05 : (fallingFast ? 0.35 : 0)),
        angryStomp ? 1.9 : (fallingExtreme ? 1.45 : (fallingVeryFast ? 1.8 : 2.0)),
        0,
        TAU
      );
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.beginPath();
      ctx.arc(cx + look + 0.55, eyeYOffset - 0.75, 0.65, 0, TAU);
      ctx.fill();
    }

    drawEye(-7.2);
    drawEye(7.2);

    // Brows/lids
    ctx.strokeStyle = angryStomp
      ? "rgba(29,35,32,.95)"
      : "rgba(29,35,32,.65)";
    ctx.lineWidth = angryStomp ? 2.3 : 1.7;
    ctx.lineCap = "round";

    if (angryStomp) {
      // Strong inward V brows: angry-emoji read.
      ctx.beginPath();
      ctx.moveTo(-11 + look * 0.16, -9.2);
      ctx.lineTo(-3.1 + look * 0.20, -6.2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(11 + look * 0.16, -9.2);
      ctx.lineTo(3.1 + look * 0.20, -6.2);
      ctx.stroke();
    } else {
      if (fallingExtreme) {
        ctx.strokeStyle = "rgba(29,35,32,.45)";
      }

      ctx.beginPath();
      ctx.moveTo(-11.3 + look * 0.22, -8.7 - Math.abs(horizontalIntent) * 0.5);
      ctx.quadraticCurveTo(
        -7.0 + look * 0.3,
        -11.0 - horizontalIntent * 0.7,
        -3.0 + look * 0.28,
        -8.1
      );
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(3.0 + look * 0.28, -8.1);
      ctx.quadraticCurveTo(
        7.0 + look * 0.3,
        -11.0 + horizontalIntent * 0.7,
        11.3 + look * 0.22,
        -8.7 - Math.abs(horizontalIntent) * 0.5
      );
      ctx.stroke();
    }

    // Mouth
    ctx.strokeStyle = "rgba(29,35,32,.82)";
    ctx.fillStyle = "transparent";
    ctx.lineWidth = 1.65;

    if (angryStomp) {
      // Open angry mouth, emoji-like but still in the paper style.
      ctx.fillStyle = "#302326";
      ctx.beginPath();
      ctx.ellipse(horizontalIntent * 0.6, 6.8, 4.8, 4.2, 0, 0, TAU);
      ctx.fill();

      // Small tooth highlight keeps the mouth readable rather than a flat dark blob.
      ctx.fillStyle = "#fff7ea";
      ctx.beginPath();
      ctx.roundRect?.(-2.8 + horizontalIntent * 0.6, 3.3, 5.6, 1.8, 0.8);
      ctx.fill();
    } else if (fallingFast) {
      ctx.beginPath();
      ctx.ellipse(
        horizontalIntent * 1.2,
        fallingExtreme ? 7.3 : 6.8,
        fallingExtreme ? 4.4 : (fallingVeryFast ? 3.8 : 3.0),
        fallingExtreme ? 5.4 : (fallingVeryFast ? 4.6 : 3.8),
        0,
        0,
        TAU
      );
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-4.1 + horizontalIntent * 0.7, 5.2);
      ctx.quadraticCurveTo(horizontalIntent * 1.4, 7.7, 4.1 + horizontalIntent * 0.7, 5.2);
      ctx.stroke();
    }

    // Soft blush
    ctx.fillStyle = "rgba(255,148,148,.14)";
    ctx.beginPath();
    ctx.ellipse(-11.5, 2.8, 2.5, 1.5, -0.15, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(11.5, 2.8, 2.5, 1.5, 0.15, 0, TAU);
    ctx.fill();

    if (STATE.mode === MODE.DEATH && STATE.deathPhase === 0) {
      const k = clamp(STATE.deathTimer / 0.48, 0, 1);
      const hit = 1 - Math.pow(1 - k, 3);

      // Impact ring inside the body.
      ctx.globalAlpha = (1 - k) * 0.42;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER.radius * (0.30 + hit * 0.55), 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Multi-branch cracks grow progressively.
      ctx.strokeStyle = "#171a18";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const branches = [
        [[0,-15],[-2,-9],[2,-4],[-2,1],[1,6],[-2,14]],
        [[-2,-8],[-8,-10],[-13,-7],[-16,-9]],
        [[2,-4],[8,-7],[13,-4],[16,-5]],
        [[-2,1],[-8,5],[-12,10],[-15,12]],
        [[1,6],[7,8],[11,13]],
      ];

      for (let b = 0; b < branches.length; b++) {
        const threshold = b === 0 ? 0 : 0.18 + b * 0.10;
        if (k < threshold) continue;

        const pts = branches[b];
        const local = clamp((k - threshold) / Math.max(0.001, 1 - threshold), 0, 1);
        const maxSeg = Math.max(1, Math.ceil((pts.length - 1) * local));

        ctx.lineWidth = b === 0 ? 2.7 : 1.8;
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);

        for (let i = 1; i <= maxSeg && i < pts.length; i++) {
          ctx.lineTo(pts[i][0], pts[i][1]);
        }
        ctx.stroke();
      }

      // A tiny compression pulse before the final shatter.
      ctx.globalAlpha = 0.18 * Math.sin(k * Math.PI);
      ctx.strokeStyle = "#365f52";
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER.radius - 2, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }


  function drawLandingPulse() {
    if (STATE.landingFlash <= 0 || STATE.mode !== MODE.PLAYING) return;

    const a = clamp(STATE.landingFlash / 0.09, 0, 1);
    const T = mixedTheme();

    ctx.save();
    ctx.globalAlpha = a * 0.20;
    ctx.strokeStyle = T.playerStroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(
      PLAYER.x,
      PLAYER.y + PLAYER.radius + 2,
      18 + (1 - a) * 16,
      5 + (1 - a) * 5,
      0,
      0,
      TAU
    );
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    ctx.fillStyle = "#4f7b68";

    for (const p of particles) {
      if (!p.active) continue;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const p of STATE.popupPool) {
      if (!p.active) continue;

      ctx.globalAlpha = p.life / p.maxLife;
      ctx.font = "900 10px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
      ctx.fillStyle =
        p.kind === "good" ? "#356b50" :
        p.kind === "bad" ? "#a64642" :
        "#303a35";

      ctx.fillText(p.text, p.x, p.y);
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }



  // PHASE-0 — FLICK-EZME + KIRILABİLİR PLATFORM TUTORIAL MINI DEMOSU
  function drawTutorialStompDemo() {
    if (STATE.mode !== MODE.TUTORIAL) return;

    const T = mixedTheme();

    // 2.35 second loop:
    // 0.00–0.38 wait
    // 0.38–0.70 finger swipe + dive
    // 0.62–0.88 fragile platform shatters
    // 0.88–1.06 ball continues through and stomps enemy
    // 1.06–1.38 particles/+50
    // 1.38–2.35 pause/reset
    const loop = STATE.tutorialTime % 2.35;

    const panelW = IS_MOBILE ? 132 : 144;
    const panelH = IS_MOBILE ? 170 : 176;
    const panelX = W * 0.5 - panelW * 0.5;
    const desiredY = PLAYER.y + (IS_MOBILE ? 230 : 222);
    const panelY = Math.min(H - panelH - 18, desiredY);

    ctx.save();

    // Distinct bonus panel so movement and stomp controls are not confused.
    ctx.globalAlpha = 0.94;
    ctx.fillStyle = T.panel || "rgba(255,255,255,.76)";
    ctx.strokeStyle = T.text;
    ctx.lineWidth = 1.8;
    roundRectPath(panelX, panelY, panelW, panelH, 12);
    ctx.fill();
    ctx.globalAlpha = 0.40;
    ctx.stroke();

    ctx.globalAlpha = 0.82;
    ctx.fillStyle = T.text;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.font = "900 10px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
    ctx.fillText("BONUS:", panelX + 10, panelY + 13);

    ctx.textAlign = "center";
    ctx.font = "900 10px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
    ctx.fillText(
      IS_MOBILE ? "TAP = BREAK + STOMP" : "FLICK = BREAK + STOMP",
      panelX + panelW * 0.5,
      panelY + 28
    );

    const cx = panelX + panelW * 0.5;
    const fragileY = panelY + 92;
    const enemyPlatformY = panelY + panelH - 23;
    const enemyY = enemyPlatformY - 10;

    // Bottom solid platform with enemy.
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = T.platform || "#d8d0be";
    ctx.strokeStyle = T.text;
    ctx.lineWidth = 1.5;
    roundRectPath(cx - 39, enemyPlatformY, 78, 8, 4);
    ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.stroke();

    // Timeline helpers.
    const diveT = clamp((loop - 0.38) / 0.68, 0, 1);
    const swipeT = clamp((loop - 0.38) / 0.32, 0, 1);
    const fragileT = clamp((loop - 0.62) / 0.28, 0, 1);
    const stompT = clamp((loop - 0.88) / 0.18, 0, 1);
    const scoreT = clamp((loop - 1.06) / 0.32, 0, 1);

    const fragileBroken = loop >= 0.70 && loop < 2.10;
    const enemyGone = loop >= 0.98 && loop < 2.10;

    // Fragile platform before the enemy.
    if (!fragileBroken) {
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = "#d8c58f";
      ctx.strokeStyle = "#6e6045";
      ctx.lineWidth = 1.4;
      roundRectPath(cx - 34, fragileY, 68, 7, 3);
      ctx.fill();
      ctx.stroke();

      // visible crack marks
      ctx.strokeStyle = "#78684b";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(cx - 7, fragileY + 1);
      ctx.lineTo(cx - 2, fragileY + 4);
      ctx.lineTo(cx + 2, fragileY + 1);
      ctx.moveTo(cx + 12, fragileY + 1);
      ctx.lineTo(cx + 8, fragileY + 5);
      ctx.stroke();
    } else {
      // Broken fragile pieces falling away while ball passes through.
      for (let i = 0; i < 6; i++) {
        const side = i < 3 ? -1 : 1;
        const idx = i % 3;
        const px = cx + side * (10 + idx * 8 + fragileT * (8 + idx * 3));
        const py = fragileY + 3 + fragileT * (7 + idx * 5);
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(side * (0.20 + idx * 0.18) + fragileT * side * 0.8);
        ctx.globalAlpha = clamp(1 - fragileT * 0.85, 0, 1) * 0.90;
        ctx.fillStyle = "#d8c58f";
        ctx.strokeStyle = "#6e6045";
        ctx.lineWidth = 1;
        ctx.fillRect(-5, -2, 10, 4);
        ctx.strokeRect(-5, -2, 10, 4);
        ctx.restore();
      }

      // Dust from the fragile platform.
      for (let i = 0; i < 8; i++) {
        const a = i * (TAU / 8);
        const d = 4 + fragileT * (10 + (i % 3) * 2);
        ctx.globalAlpha = clamp(1 - fragileT, 0, 1) * 0.46;
        ctx.fillStyle = "#b7a77e";
        ctx.beginPath();
        ctx.arc(
          cx + Math.cos(a) * d,
          fragileY + 3 + Math.sin(a) * d * 0.45,
          1.1 + (i % 2) * 0.5,
          0,
          TAU
        );
        ctx.fill();
      }
    }

    // Mini enemy icon.
    if (!enemyGone) {
      const er = 10;

      ctx.globalAlpha = 0.96;
      ctx.fillStyle = "#6f8f65";
      ctx.strokeStyle = "#2b3030";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(cx, enemyY, er * 0.92, er * 0.76, 0, 0, TAU);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#516d4d";
      ctx.lineWidth = 1.3;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * 5, enemyY - 6);
        ctx.lineTo(cx + i * 6.5, enemyY - 12);
        ctx.stroke();

        ctx.fillStyle = "#7b638d";
        ctx.beginPath();
        ctx.arc(cx + i * 6.5, enemyY - 12, 1.6, 0, TAU);
        ctx.fill();
      }

      ctx.fillStyle = "#765f8b";
      ctx.beginPath();
      ctx.arc(cx - 5.2, enemyY + 2.5, 2.2, 0, TAU);
      ctx.arc(cx + 5.5, enemyY + 1.0, 1.8, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#fffdf3";
      ctx.beginPath();
      ctx.arc(cx - 3.2, enemyY - 2.0, 2.3, 0, TAU);
      ctx.arc(cx + 3.2, enemyY - 2.0, 2.3, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#24282a";
      ctx.beginPath();
      ctx.arc(cx - 3.0, enemyY - 1.8, 0.9, 0, TAU);
      ctx.arc(cx + 3.4, enemyY - 1.8, 0.9, 0, TAU);
      ctx.fill();
    }

    // Ball waits, then dives THROUGH fragile and reaches enemy.
    let ballY = panelY + 51;
    if (loop >= 0.38 && loop < 1.06) {
      const eased = diveT * diveT * (3 - 2 * diveT);
      ballY = lerp(panelY + 51, enemyY - 17, eased);
    } else if (loop >= 1.06 && loop < 1.34) {
      ballY = enemyY - 17;
    }

    if (loop < 1.34) {
      ctx.globalAlpha = 0.98;
      ctx.fillStyle = T.player;
      ctx.strokeStyle = T.playerStroke;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(cx, ballY, 7.2, 0, TAU);
      ctx.fill();
      ctx.stroke();

      if (loop >= 0.38) {
        ctx.strokeStyle = "#26302c";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(cx - 4.2, ballY - 2.4);
        ctx.lineTo(cx - 1.0, ballY - 1.0);
        ctx.moveTo(cx + 4.2, ballY - 2.4);
        ctx.lineTo(cx + 1.0, ballY - 1.0);
        ctx.stroke();
      }
    }

    // Finger demonstrates the quick downward gesture.
    if (loop >= 0.38 && loop < 0.78) {
      const fingerX = cx + 31;
      const fingerY = lerp(panelY + 48, panelY + 82, swipeT);

      ctx.globalAlpha = 0.80;
      ctx.strokeStyle = T.text;
      ctx.fillStyle = T.bg || "#f5f1e8";
      ctx.lineWidth = 1.8;

      ctx.beginPath();
      ctx.arc(fingerX, fingerY, 6.3, 0, TAU);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(fingerX, fingerY + 5);
      ctx.lineTo(fingerX, fingerY + 15);
      ctx.stroke();

      ctx.textAlign = "left";
      ctx.font = "900 8px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
      ctx.fillStyle = T.text;
      ctx.fillText(IS_MOBILE ? "TEK DOKUN" : "AŞAĞI ÇEK", fingerX - 20, panelY + 116);
    }

    // Enemy shatter particles after impact.
    if (loop >= 0.94 && loop < 1.42) {
      const burstT = clamp((loop - 0.94) / 0.34, 0, 1);
      const fade = 1 - clamp((loop - 1.14) / 0.28, 0, 1);

      for (let i = 0; i < 10; i++) {
        const a = i * (TAU / 10) + 0.20;
        const d = 4 + burstT * (14 + (i % 3) * 3);
        ctx.globalAlpha = fade * 0.72;
        ctx.fillStyle = i % 2 ? "#7b638d" : "#839b73";
        ctx.beginPath();
        ctx.arc(
          cx + Math.cos(a) * d,
          enemyY + Math.sin(a) * d * 0.55,
          1.2 + (i % 3) * 0.5,
          0,
          TAU
        );
        ctx.fill();
      }

      if (loop >= 1.06) {
        ctx.globalAlpha = fade * 0.95;
        ctx.textAlign = "center";
        ctx.fillStyle = T.text;
        ctx.font = "900 12px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
        ctx.fillText("+50", cx, enemyY - 30 - scoreT * 7);
      }
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function drawTutorial() {
    if (STATE.mode !== MODE.TUTORIAL) return;

    const T = mixedTheme();
    const y = PLAYER.y + 78;
    const pulse = 0.78 + Math.sin(STATE.tutorialTime * 3.2) * 0.12;

    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = T.text;
    ctx.fillStyle = T.text;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // long horizontal drag guide
    ctx.beginPath();
    ctx.moveTo(W * 0.5 - 80, y);
    ctx.lineTo(W * 0.5 + 80, y);
    ctx.stroke();

    // left arrow head
    ctx.beginPath();
    ctx.moveTo(W * 0.5 - 80, y);
    ctx.lineTo(W * 0.5 - 66, y - 10);
    ctx.moveTo(W * 0.5 - 80, y);
    ctx.lineTo(W * 0.5 - 66, y + 10);
    ctx.stroke();

    // right arrow head
    ctx.beginPath();
    ctx.moveTo(W * 0.5 + 80, y);
    ctx.lineTo(W * 0.5 + 66, y - 10);
    ctx.moveTo(W * 0.5 + 80, y);
    ctx.lineTo(W * 0.5 + 66, y + 10);
    ctx.stroke();

    ctx.font = "900 20px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
    ctx.fillText("DRAG", W * 0.5, y + 38);

    // Standalone FLICK DOWN arrow removed.
    // The bonus action is taught only by the animated mini demo below.
    const fy = y + 82;

    ctx.font = "900 11px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
    ctx.globalAlpha = 0.68;
    ctx.fillText("BREAK FRAGILE • HIT CREATURES", W * 0.5, fy + 8);

    ctx.globalAlpha = 0.72;
    ctx.fillText("TAP TO START", W * 0.5, fy + 34);

    ctx.restore();

    // PHASE-0 — distinct looping bonus-action demonstration.
    drawTutorialStompDemo();
  }



  // PHASE-1 — ONE-TIME FIRST ENEMY CONTEXTUAL HINT
  function drawEnemyContextHint() {
    if (
      STATE.mode !== MODE.PLAYING ||
      STATE.enemyHintTimer <= 0 ||
      STATE.enemyHintEnemyId == null
    ) return;

    const enemy = STATE.enemies.find(e =>
      e.id === STATE.enemyHintEnemyId &&
      e.active &&
      !e.squashed
    );
    if (!enemy) return;

    const T = mixedTheme();
    const elapsed = STATE.enemyHintDuration - STATE.enemyHintTimer;
    const fadeIn = clamp(elapsed / 0.18, 0, 1);
    const fadeOut = clamp(STATE.enemyHintTimer / 0.48, 0, 1);
    const alpha = Math.min(fadeIn, fadeOut);

    const bob = Math.sin(STATE.time * 5.2) * 2;
    const bx = clamp(enemy.x, 54, W - 54);
    const by = Math.max(48, enemy.y - enemy.radius - 31 + bob);

    ctx.save();
    ctx.globalAlpha = alpha * 0.94;

    // Bubble
    ctx.fillStyle = T.panel || "rgba(255,255,255,.88)";
    ctx.strokeStyle = T.text;
    ctx.lineWidth = 1.8;
    roundRectPath(bx - 47, by - 15, 94, 28, 9);
    ctx.fill();
    ctx.globalAlpha = alpha * 0.38;
    ctx.stroke();

    // Bubble tail pointing to the enemy
    ctx.globalAlpha = alpha * 0.94;
    ctx.fillStyle = T.panel || "rgba(255,255,255,.88)";
    ctx.strokeStyle = T.text;
    ctx.beginPath();
    ctx.moveTo(bx - 6, by + 12);
    ctx.lineTo(bx + 6, by + 12);
    ctx.lineTo(enemy.x, Math.max(by + 18, enemy.y - enemy.radius - 3));
    ctx.closePath();
    ctx.fill();

    // Down-arrow + text
    ctx.fillStyle = T.text;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "900 11px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
    ctx.fillText(IS_MOBILE ? "DOKUN!" : "AŞAĞI ÇEK!", bx, by - 1);

    // No standalone down-arrow icon here; text + tutorial animation are enough.
    ctx.restore();
  }

  function drawFlickHint() {
    if (
      STATE.mode !== MODE.PLAYING ||
      STATE.flickHintTimer <= 0
    ) return;

    const T = mixedTheme();
    const fadeIn = clamp((5.2 - STATE.flickHintTimer) / 0.35, 0, 1);
    const fadeOut = clamp(STATE.flickHintTimer / 0.8, 0, 1);
    const a = Math.min(fadeIn, fadeOut);

    ctx.save();
    ctx.globalAlpha = a * 0.82;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.strokeStyle = T.text;
    ctx.fillStyle = T.text;
    ctx.lineWidth = 2.6;
    ctx.lineCap = "round";

    const x = W * 0.5;
    const y = H * 0.22;

    // Standalone down-arrow icon removed; animation teaches the gesture.
    ctx.font = "900 13px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
    ctx.fillText("STOMP BONUS", x, y + 20);

    ctx.font = "900 10px Comic Sans MS, Comic Sans, Chalkboard SE, Marker Felt, Segoe Print, cursive";
    ctx.globalAlpha = a * 0.58;
    ctx.fillText(IS_MOBILE ? "TAP TO STOMP" : "USE STOMP", x, y + 38);

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // Interpolate fixed-step physics for buttery-smooth rendering.
    // Physics values are restored immediately after drawing.
    const alpha = (STATE.mode === MODE.PLAYING || STATE.mode === MODE.TUTORIAL)
      ? clamp(STATE.renderAlpha, 0, 1)
      : 1;

    const savedPlayerX = PLAYER.x;
    const savedPlayerY = PLAYER.y;
    const savedPlatformPositions = [];
    const savedEnemyPositions = [];

    if (STATE.mode === MODE.PLAYING || STATE.mode === MODE.TUTORIAL) {
      PLAYER.x = lerp(PLAYER.prevX, PLAYER.x, alpha);
      PLAYER.y = lerp(PLAYER.prevY, PLAYER.y, alpha);

      for (const p of STATE.platforms) {
        savedPlatformPositions.push([p, p.x, p.y]);
        p.x = lerp(p.prevX, p.x, alpha);
        p.y = lerp(p.prevY, p.y, alpha);
      }

      for (const enemy of STATE.enemies) {
        savedEnemyPositions.push([enemy, enemy.x, enemy.y]);
        enemy.x = lerp(enemy.prevX, enemy.x, alpha);
        enemy.y = lerp(enemy.prevY, enemy.y, alpha);
      }
    }

    const deathShake =
      STATE.mode === MODE.DEATH && STATE.deathPhase === 0
        ? Math.max(0, 1 - STATE.deathTimer / 0.48) * 6
        : 0;

    const shakeAmp = Math.max(deathShake, STATE.impactShake);

    ctx.save();
    if (shakeAmp) {
      ctx.translate(
        Math.sin(STATE.deathTimer * 110) * shakeAmp,
        Math.cos(STATE.deathTimer * 91) * shakeAmp * 0.5
      );
    }

    drawBackground();
    drawPlatforms();
    drawEnemies();
    drawWindZones();
    drawLandingPulse();
    drawParticles();
    drawDeathPieces();
    drawPlayer();
    drawTutorial();
    drawEnemyContextHint();
    drawFlickHint();
    drawPopups();

    // Last layer: platforms visually pass behind the top spikes.
    drawTopSpikes();

    ctx.restore();

    if (STATE.mode === MODE.PLAYING || STATE.mode === MODE.TUTORIAL) {
      PLAYER.x = savedPlayerX;
      PLAYER.y = savedPlayerY;

      for (const item of savedPlatformPositions) {
        item[0].x = item[1];
        item[0].y = item[2];
      }

      for (const item of savedEnemyPositions) {
        item[0].x = item[1];
        item[0].y = item[2];
      }
    }
  }


  // UYUM KONTROLÜ
  // - Enemy RNG, patrol direction and patrol speed use STATE.rng().
  // - Enemy patrol is restricted to the middle ~44% of its host platform.
  // - Revive platform and tutorial/start platform set noEnemy=true.
  // - Only NORMAL/MOVING platforms can spawn enemies.
  // - Max 8 active enemies.
  // - Normal contact with an unsquashed enemy is deadly.
  // - ArrowDown triggers the same flick-stomp action on desktop.
  // - Existing 1:1 pointer controls are untouched.
  // - Existing pooled particles and AudioSys voices are reused.
  // - Ghost Race is not present in this source; STATE.setRunSeed(seed) is
  //   exposed so a ghost/replay can reproduce the exact enemy RNG stream.


  // PHASE-2
  // TESLİM SONRASI KONTROLÜ
  // [x] Platform width distribution restored to the wider 88..154 formula.
  // [x] Enemy patrol uses only the middle ~40%; platform width is untouched.
  // [x] Normal landing does not call enemy squash logic.
  // [x] Down flick uses Y samples only and never writes horizontal input state.
  // [x] Flick outside enemy range has no penalty.
  // [x] ArrowDown triggers the same flick action on desktop.
  // [x] Normal contact with an active enemy causes death.
  // [x] ParticleSys, platforms, AudioSys, MusicSys, Enemy and WindParticleSys remain defined.

  // ============================================================
  // 14) GAME LOOP
  // ============================================================
  function frame(now) {
    if (!STATE.lastRAF) STATE.lastRAF = now;

    let frameDt = (now - STATE.lastRAF) / 1000;
    STATE.lastRAF = now;

    frameDt = Math.min(frameDt, MAX_FRAME_DT);
    STATE.accumulator += frameDt;

    let safety = 0;
    while (STATE.accumulator >= FIXED_DT && safety < 18) {
      fixedUpdate(FIXED_DT);
      STATE.accumulator -= FIXED_DT;
      safety++;
    }

    STATE.renderAlpha = STATE.accumulator / FIXED_DT;
    render();
    requestAnimationFrame(frame);
  }


  window.addEventListener("orientationchange", () => {
    // Recalculate the logical viewport cleanly after rotation.
    setTimeout(() => location.reload(), 120);
  });

  // ============================================================
  // 15) INPUT — TOUCH / MOUSE 1:1
  // ============================================================


  function pointerToGameX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }


  canvas.addEventListener("pointerdown", e => {
    AudioSys.init();

    const startedInTutorial = STATE.mode === MODE.TUTORIAL;

    if (startedInTutorial) {
      beginActualRun();
    }

    AudioSys.resume().then(() => {
      if (
        STATE.mode === MODE.PLAYING &&
        AudioSys.ctx &&
        AudioSys.ctx.state === "running" &&
        !MusicSys.running
      ) {
        MusicSys.start();
      }
    });

    INPUT.active = true;
    INPUT.pointerId = e.pointerId;

    // Important: touching again must NOT teleport the ball.
    // Store the new finger position only as a drag reference.
    INPUT.lastPointerX = pointerToGameX(e.clientX);

    // PHASE-1 — initialize independent Y-only flick history.
    INPUT.flickSamples.length = 0;
    const flickNow = Number.isFinite(e.timeStamp) ? e.timeStamp : performance.now();
    INPUT.flickStartY = e.clientY;
    INPUT.flickStartTime = flickNow;
    INPUT.flickTriggeredForPointer = false;
    INPUT.pointerStartClientX = e.clientX;
    INPUT.pointerStartClientY = e.clientY;
    INPUT.suppressTapStomp = startedInTutorial;
    INPUT.mobileGestureIsDrag = false;
    INPUT.flickAccumDown = 0;
    INPUT.flickLastY = e.clientY;
    INPUT.flickSmoothedVY = 0;
    INPUT.flickSamples.push({
      y: e.clientY,
      t: flickNow
    });

    canvas.setPointerCapture?.(e.pointerId);
  });

  canvas.addEventListener("pointermove", e => {
    if (!INPUT.active || e.pointerId !== INPUT.pointerId) return;

    const currentX = pointerToGameX(e.clientX);
    const deltaX = currentX - INPUT.lastPointerX;
    INPUT.lastPointerX = currentX;

    // MOBILE: once the finger moves meaningfully, this gesture becomes
    // a movement drag and can no longer trigger stomp on release.
    if (IS_MOBILE && !INPUT.mobileGestureIsDrag) {
      const totalDx = e.clientX - INPUT.pointerStartClientX;
      const totalDy = e.clientY - INPUT.pointerStartClientY;
      if (Math.hypot(totalDx, totalDy) >= CONFIG.controls.mobileDragLockMove) {
        INPUT.mobileGestureIsDrag = true;
      }
    }

    // Faster drag response while preserving relative-drag behavior:
    // touching again never teleports the ball.
    const DRAG_SENSITIVITY = 1.42;
    PLAYER.targetX = clamp(
      PLAYER.targetX + deltaX * DRAG_SENSITIVITY,
      PLAYER.radius,
      W - PLAYER.radius
    );

    // Desktop keeps the original flick detector.
    // Mobile uses tap-only stomp to prevent accidental activation while dragging.
    if (!IS_MOBILE) {
      recordFlickSample(e.clientY, e.timeStamp);
    }

  });

  function endPointer(e) {
    if (e.pointerId !== INPUT.pointerId) return;

    const now = Number.isFinite(e.timeStamp) ? e.timeStamp : performance.now();
    const dtMs = Math.max(1, now - INPUT.flickStartTime);

    // MOBILE ONLY — stomp is now TAP-ONLY.
    // If the gesture ever became a drag, it is guaranteed not to stomp.
    if (
      IS_MOBILE &&
      STATE.mode === MODE.PLAYING &&
      !INPUT.suppressTapStomp &&
      !INPUT.mobileGestureIsDrag &&
      !INPUT.flickTriggeredForPointer
    ) {
      const tapDx = e.clientX - INPUT.pointerStartClientX;
      const tapDy = e.clientY - INPUT.pointerStartClientY;
      const tapMove = Math.hypot(tapDx, tapDy);

      if (
        dtMs <= CONFIG.controls.mobileTapMaxMs &&
        tapMove <= CONFIG.controls.mobileTapMaxMove &&
        now - INPUT.lastFlickAt >= CONFIG.controls.flickCooldownMs
      ) {
        INPUT.flickTriggeredForPointer = true;
        INPUT.lastFlickAt = now;
        triggerDownFlick();
      }
    }

    INPUT.active = false;
    INPUT.pointerId = null;
    INPUT.lastPointerX = 0;
    INPUT.flickSamples.length = 0;
    INPUT.flickTriggeredForPointer = false;
    INPUT.suppressTapStomp = false;
    INPUT.mobileGestureIsDrag = false;
    INPUT.flickAccumDown = 0;
    INPUT.flickSmoothedVY = 0;
  }

  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  // Desktop test fallback
  window.addEventListener("keydown", e => {
    if (STATE.mode === MODE.TUTORIAL && (e.code === "Space" || e.code === "Enter")) {
      beginActualRun();
      e.preventDefault();
      return;
    }

    if (e.code === "ArrowLeft" || e.code === "KeyA") {
      INPUT.keyboardDir = -1;
      e.preventDefault();
    }
    if (e.code === "ArrowRight" || e.code === "KeyD") {
      INPUT.keyboardDir = 1;
      e.preventDefault();
    }

    // Desktop: ArrowDown fires the exact same stomp signal as a mobile flick.
    if (e.code === "ArrowDown") {
      if (!e.repeat) triggerDownFlick();
      e.preventDefault();
    }
  }, { passive: false });

  window.addEventListener("keyup", e => {
    if (
      e.code === "ArrowLeft" ||
      e.code === "KeyA" ||
      e.code === "ArrowRight" ||
      e.code === "KeyD"
    ) {
      INPUT.keyboardDir = 0;
    }
  });


  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" && STATE.windEvent) {
      finishWindEvent();
    }

    if (
      document.visibilityState === "visible" &&
      STATE.mode === MODE.PLAYING
    ) {
      AudioSys.resume().then(() => {
        if (AudioSys.ctx && AudioSys.ctx.state === "running") {
          MusicSys.start();
        }
      });
    }
  });

  playBtn.addEventListener("click", startGame);
  reviveBtn.addEventListener("click", () => {
    // Placeholder ad-continue hook: connect your ad SDK here before performRevive().
    performRevive();
  });

  function refreshMuteButton() {
    muteBtn.classList.toggle("muted", AudioSys.muted);
    muteBtn.setAttribute("aria-label", AudioSys.muted ? "Unmute sound" : "Mute sound");
    muteBtn.title = AudioSys.muted ? "Sound off" : "Sound on";
  }

  muteBtn.addEventListener("click", () => {
    AudioSys.init();
    AudioSys.resume();

    AudioSys.muted = !AudioSys.muted;
    localStorage.setItem("paperFallMuted", AudioSys.muted ? "1" : "0");

    if (AudioSys.master && AudioSys.ctx) {
      AudioSys.master.gain.setTargetAtTime(
        AudioSys.muted ? 0 : 0.82,
        AudioSys.ctx.currentTime,
        0.04
      );
    }

    refreshMuteButton();

    if (!AudioSys.muted) {
      AudioSys.blip(659.25, 0.08, 0.05);
    }
  });

  refreshMuteButton();
  muteBtn.style.display = "grid";

  // Initial draw
  document.getElementById("hud").style.display = "none";
  panelText.innerHTML = `<b>Best: ${Math.floor(STATE.best)}</b>`;
  resetGame();
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
