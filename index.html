<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PAPER FALL</title>
<style>
  *{box-sizing:border-box;margin:0;
    padding:0;padding:0}
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#dfe8e2;
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive;
    touch-action:none;
    user-select:none;
  }
  body{display:grid;place-items:center}
  #gameWrap{
    position:relative;
    width:600px;
    height:800px;
  }
  canvas{
    display:block;
    width:600px;
    height:800px;
    background:#f6f0df;
    border:3px solid #29332f;
    border-radius:18px;
  }

  @media (max-width:700px){
    html,body{
      width:100%;
      height:100%;
      min-height:100dvh;
      overflow:hidden;
    }
    body{
      align-items:center;
      justify-items:center;
    }
    #gameWrap{
      width:100dvw !important;
      height:100dvh !important;
      max-width:none;
      max-height:none;
    }
    canvas{
      width:100dvw !important;
      height:100dvh !important;
      border:0;
      border-radius:0;
    }
    #hud{
      left:12px;
      top:48px;
    }
    #score{
      font-size:20px;
    }
    #best{
      font-size:13px;
    }
    #panel{
      width:min(88%,390px);
      padding:22px;
    }
    #panel h1{
      font-size:40px;
    }
  }
  #hud{
    position:absolute;
    left:14px;
    top:54px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:0;
    color:#24302b;
    pointer-events:none;
    text-shadow:0 1px rgba(255,255,255,.72);
    display:none;
    z-index:5;
  }
  #score{
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive;
    font-size:18px;
    font-weight:900;
    letter-spacing:.35px;
    line-height:1;
  }
  #muteBtn{
    position:absolute;
    right:16px;
    top:16px;
    z-index:12;
    width:46px;
    height:46px;
    min-width:46px;
    padding:0;
    display:grid;
    place-items:center;
    border:2px solid #29332f;
    border-radius:50%;
    background:#fffaf0;
    color:#29332f;
    font:900 20px/1 "Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive;
    box-shadow:0 3px 0 #29332f;
    cursor:pointer;
  }
  #muteBtn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #29332f;
  }
  #overlay{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    background:rgba(246,240,223,.78);
    backdrop-filter:blur(3px);
    border-radius:18px;
  }
  #panel{
    width:min(86%,350px);
    background:#fffaf0;
    border:3px solid #29332f;
    border-radius:18px;
    padding:24px;
    text-align:center;
    color:#29332f;
    box-shadow:0 7px 0 #29332f;
  }
  #panel h1{
    font-size:38px;
    margin-bottom:8px;
  }
  #panel p{
    color:#65716b;
    line-height:1.45;
    margin-bottom:12px;
  }
  button{
    width:100%;
    border:3px solid #29332f;
    border-radius:12px;
    padding:12px 18px;
    background:#f4c95d;
    color:#29332f;
    font:900 17px "Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive;
    box-shadow:0 5px 0 #29332f;
    cursor:pointer;
  }
  button:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #29332f;
  }

  #panel,
  #panel h1,
  #panel p,
  #panelText,
  #panelTitle,
  #playBtn,
  button,
  #muteBtn{
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive !important;
  }


  #best{
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive;
    font-size:12px;
    font-weight:900;
    opacity:.82;
    margin-top:3px;
  }

  .speakerSvg{
    display:block;
    width:24px;
    height:24px;
  }
  .speakerBody{
    fill:#29332f;
  }
  .speakerWave{
    fill:none;
    stroke:#29332f;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  #muteBtn.muted .speakerWave{
    display:none;
  }
  #muteBtn.muted::after{
    content:"";
    position:absolute;
    width:24px;
    height:3px;
    background:#a64540;
    border-radius:2px;
    transform:rotate(-45deg);
    right:5px;
    top:21px;
  }


  html,body,#gameWrap,#hud,#score,#best,#overlay,#panel,#panelTitle,#panelText,
  button,#playBtn,#muteBtn{
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive !important;
  }


  #reviveCountdown{
    margin:4px 0 12px;
    font-size:32px;
    font-weight:900;
    line-height:1;
    color:#c84d48;
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Segoe Print",cursive !important;
  }
  #reviveBtn{
    margin-bottom:10px;
    background:#ef5c54;
    color:#fffaf0;
  }


  @media (max-width:700px){
    #game{
      width:100dvw !important;
      height:100dvh !important;
      touch-action:none;
    }
  }

</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score">SCORE 0</div>
    <div id="best">BEST 0</div>
  </div>

  <button id="muteBtn" aria-label="Toggle sound" title="Sound">
      <svg class="speakerSvg" aria-hidden="true" viewBox="0 0 64 64">
        <path class="speakerBody" d="M10 26 H22 L35 15 V49 L22 38 H10 Z"></path>
        <path class="speakerWave waveA" d="M41 24 Q48 32 41 40"></path>
        <path class="speakerWave waveB" d="M46 18 Q57 32 46 46"></path>
      </svg>
    </button>

  <div id="overlay">
    <div id="panel">
      <h1 id="panelTitle">PAPER FALL</h1>
      <p id="panelText"></p>
      <div id="reviveCountdown" style="display:none"></div>
      <button id="reviveBtn" style="display:none">WATCH AD & CONTINUE</button>
      <button id="playBtn">PLAY</button>
    </div>
  </div>
</div>

<script>
"use strict";

(() => {
  // ============================================================
  // 0) TEMEL SİSTEMLER — tüm ana identifier'lar baştan tanımlı
  // ============================================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const panelTitle = document.getElementById("panelTitle");
  const panelText = document.getElementById("panelText");
  const playBtn = document.getElementById("playBtn");
  const reviveBtn = document.getElementById("reviveBtn");
  const reviveCountdown = document.getElementById("reviveCountdown");
  const muteBtn = document.getElementById("muteBtn");

  const DPR = Math.min(window.devicePixelRatio || 1, 1.4);
  const IS_MOBILE = window.matchMedia("(max-width:700px)").matches;

  // Desktop keeps the original 600-wide world.
  // Mobile uses a slightly narrower logical world so the ball/platforms
  // keep the same geometry but appear larger and clearer on the phone.
  const W = IS_MOBILE ? 460 : 600;
  const mobileViewportW = Math.max(320, window.innerWidth);
  const mobileViewportH = Math.max(
    480,
    Math.floor(window.visualViewport?.height || window.innerHeight)
  );
  const H = IS_MOBILE
    ? Math.round(W * (mobileViewportH / mobileViewportW))
    : 800;

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (IS_MOBILE) {
    canvas.style.width = "100dvw";
    canvas.style.height = "100dvh";
    gameWrap.style.width = "100dvw";
    gameWrap.style.height = "100dvh";
  } else {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
  }
  const TAU = Math.PI * 2;

  const FIXED_DT = 1 / 120;
  const MAX_FRAME_DT = 0.065;

  const TYPE = Object.freeze({
    NORMAL: "NORMAL",
    MOVING: "MOVING",
    FRAGILE: "FRAGILE",
    SPIKE: "SPIKE"
  });

  const MODE = Object.freeze({
    MENU: "MENU",
    TUTORIAL: "TUTORIAL",
    PLAYING: "PLAYING",
    DEATH: "DEATH",
    REVIVE: "REVIVE",
    REVIVE_COUNTDOWN: "REVIVE_COUNTDOWN",
    GAMEOVER: "GAMEOVER"
  });


  const THEMES = [
    {
      name:"PAPER DAY",
      bg:"#f4efdf",
      line:"#35433c",
      normal:"#7eb08c",
      moving:"#79a9c6",
      fragile:"#bd9169",
      player:"#fffef8",
      playerStroke:"#365f52",
      text:"#29332f"
    },
    {
      name:"MINT SKETCH",
      bg:"#dfeee3",
      line:"#31544a",
      normal:"#71b897",
      moving:"#6ea9c9",
      fragile:"#c69268",
      player:"#fffdf6",
      playerStroke:"#2f6855",
      text:"#24372f"
    },
    {
      name:"SUNSET PAPER",
      bg:"#f1d8c4",
      line:"#734f49",
      normal:"#75a27f",
      moving:"#7499bc",
      fragile:"#b77f5e",
      player:"#fff9ef",
      playerStroke:"#6d4b45",
      text:"#44312e"
    },
    {
      name:"MIDNIGHT NOTE",
      bg:"#242832",
      line:"#aeb8c8",
      normal:"#6f9b7c",
      moving:"#668fb6",
      fragile:"#9d765f",
      player:"#f8f3e9",
      playerStroke:"#b8d8c8",
      text:"#f2eee5"
    },
    {
      name:"PURPLE NIGHT",
      bg:"#31283d",
      line:"#c7b4d2",
      normal:"#738e78",
      moving:"#737eae",
      fragile:"#a37a66",
      player:"#f8f1e9",
      playerStroke:"#d2bfd8",
      text:"#f2eaf5"
    },
    {
      name:"CHARCOAL RUN",
      bg:"#1c2023",
      line:"#b8c0c3",
      normal:"#688778",
      moving:"#617f98",
      fragile:"#8f6d5a",
      player:"#f4efe5",
      playerStroke:"#d5dfd8",
      text:"#f1f3ef"
    }
  ];

  function hexToRgb(hex) {
    const h = hex.replace("#","");
    const n = parseInt(h,16);
    return {
      r:(n>>16)&255,
      g:(n>>8)&255,
      b:n&255
    };
  }

  function mixHex(a,b,t) {
    const A=hexToRgb(a), B=hexToRgb(b);
    const r=Math.round(lerp(A.r,B.r,t));
    const g=Math.round(lerp(A.g,B.g,t));
    const bl=Math.round(lerp(A.b,B.b,t));
    return `rgb(${r},${g},${bl})`;
  }

  function mixedTheme() {
    const from = THEMES[STATE.themeFromIndex] || THEMES[0];
    const to = THEMES[STATE.themeToIndex] || from;
    const t = clamp(STATE.themeTransition,0,1);

    return {
      bg:mixHex(from.bg,to.bg,t),
      line:mixHex(from.line,to.line,t),
      normal:mixHex(from.normal,to.normal,t),
      moving:mixHex(from.moving,to.moving,t),
      fragile:mixHex(from.fragile,to.fragile,t),
      player:mixHex(from.player,to.player,t),
      playerStroke:mixHex(from.playerStroke,to.playerStroke,t),
      text:mixHex(from.text,to.text,t)
    };
  }

  function buildThemeThresholds() {
    STATE.themeThresholds = [];

    // Themes now last much longer. First change happens later, and every
    // following theme is separated by a large randomized score interval.
    let score = 1500 + Math.random() * 650;

    for (let i = 1; i < THEMES.length; i++) {
      STATE.themeThresholds.push(score);
      score += 1500 + Math.random() * 950;
    }
  }

  function updateTheme(dt) {
    let targetIndex = 0;
    for(let i=0;i<STATE.themeThresholds.length;i++){
      if(STATE.score >= STATE.themeThresholds[i]) targetIndex = i+1;
    }

    if(targetIndex !== STATE.themeToIndex){
      STATE.themeFromIndex = STATE.themeToIndex;
      STATE.themeToIndex = targetIndex;
      STATE.themeTransition = 0;
    }

    if(STATE.themeTransition < 1){
      STATE.themeTransition = Math.min(1, STATE.themeTransition + dt/2.8);
    }

    const T = mixedTheme();
    document.getElementById("hud").style.color = T.text;
  }


  const STATE = {
    mode: MODE.MENU,
    time: 0,
    score: 0,
    best: Number(localStorage.getItem("paperFallBest") || 0),
    combo: 0,
    multiplier: 1,

    scrollSpeed: 205,
    baseScoreRate: 5.2,

    platforms: [],
    nextPlatformId: 1,
    lastSpawnCenterX: null,
    lastTypes: [],

    // PHASE-0 — enemy state + deterministic RNG
    enemies: [],
    recentEnemyPlatforms: [],
    nextEnemyId: 1,
    enemyPlatformsUntilNext: 7,
    runSeed: 0x51f15e3d,
    rngState: 0x51f15e3d,
    rng() {
      // xorshift32: deterministic and cheap.
      let x = this.rngState | 0;
      x ^= x << 13;
      x ^= x >>> 17;
      x ^= x << 5;
      this.rngState = x >>> 0;
      return (this.rngState >>> 0) / 4294967296;
    },
    setRunSeed(seed) {
      const s = (seed >>> 0) || 0x51f15e3d;
      this.runSeed = s;
      this.rngState = s;
    },

    lastLandingPlatformY: null,

    accumulator: 0,
    lastRAF: 0,

    nearMissCooldownUntil: 0,

    popups: [],
    popupPool: [],

    gameStartedAt: 0,

    // Wind event
    winds: [],
    nextWindSpawnScore: 340,
    windSerial: 1,
    windEvent: null,

    // Death animation
    deathTimer: 0,
    deathPhase: 0,
    deathReason: "",
    deathPieces: [],
    deathDust: [],
    deathImpact: 0,
    reviveUsed: false,
    reviveTimer: 0,
    reviveDuration: 5,
    reviveReadyTimer: 0,
    invincibleTimer: 0,

    // Wind visual is independent from event state and is hard-reset at end.
    windVisual: 0,

    // Professional feedback / presentation
    impactShake: 0,
    speedPulse: 0,
    landingFlash: 0,
    runDistance: 0,
    renderAlpha: 1,

    themeThresholds: [],
    themeFromIndex: 0,
    themeToIndex: 0,
    themeTransition: 1,
    tutorialTime: 0,
    flickHintTimer: 0,

    // PHASE-1 — first visible enemy contextual hint.
    hasSeenEnemyHint: localStorage.getItem("paperFallEnemyHintSeen") === "1",
    enemyHintTimer: 0,
    enemyHintDuration: 1.9,
    enemyHintEnemyId: null
  };

  const PLAYER = {
    x: W * 0.5,
    y: H * 0.34,
    prevX: W * 0.5,
    prevY: H * 0.34,

    radius: IS_MOBILE ? 17 : 16,
    vy: 0,
    vx: 0,

    gravity: 1580,
    jumpVelocity: 635,
    maxFallSpeed: 860,

    targetX: W * 0.5,
    alive: true,

    // Wind is an external displacement layered over the 1:1 touch target.
    windOffset: 0,
    windVX: 0,

    // Visual-only animation values
    squash: 0,
    stretch: 0,

    lastBouncePlatformId: null
  };

  // PHASE-1
  // FLICK İLE EZME — sadece dikey pointer hareketini izler.
  const CONFIG = {
    controls: {
      // Desktop keeps the firmer flick.
      // Mobile is intentionally more forgiving because thumb travel is shorter.
      flickThreshold: IS_MOBILE ? 420 : 1050,
      flickWindowMs: IS_MOBILE ? 260 : 135,
      flickMinTravel: IS_MOBILE ? 11 : 24,
      flickCooldownMs: IS_MOBILE ? 120 : 180,

      // Slight mobile-only forgiveness around enemies.
      flickEnemyRangeMul: IS_MOBILE ? 6.0 : 4.0,

      // Desktop swipe detector remains defined for compatibility.
      mobileSwipeTravel: 13,
      mobileSwipeMaxMs: 320,
      mobileSwipeVelocity: 260,
      mobileAccumTravel: 16,

      // Mobile gameplay uses a clean short tap for stomp.
      mobileTapMaxMs: 230,
      mobileTapMaxMove: 10,
      mobileDragLockMove: 11
    }
  };

  const INPUT = {
    active: false,
    pointerId: null,
    lastPointerX: 0,
    keyboardDir: 0,
    keyboardSpeed: 540,

    // Parallel Y-only flick detector. Does not drive PLAYER.targetX.
    flickSamples: [],
    lastFlickAt: -Infinity,
    flickPulse: 0,
    flickStartY: 0,
    flickStartTime: 0,
    flickTriggeredForPointer: false,
    pointerStartClientX: 0,
    pointerStartClientY: 0,
    suppressTapStomp: false,
    mobileGestureIsDrag: false,
    flickAccumDown: 0,
    flickLastY: 0,
    flickSmoothedVY: 0,

    // Special stomp/flick animation state.
    stompDashTimer: 0,
    stompDashDuration: 0.18,
    stompDashSpeed: 900,
    stompDashRamp: 0,
    stompDashActive: false,
    stompFragileBroken: false,
    angryFaceTimer: 0,
    stompTargetId: null
  };

  // ============================================================
  // 1) BASİT SES — Bölüm 6 bonus sesleri için minimal pool
  //    (müzik daha sonra eklenecek)
  // ============================================================
  const AudioSys = {
    ctx: null,
    master: null,
    voices: [],
    index: 0,
    muted: localStorage.getItem("paperFallMuted") === "1",

    windSource: null,
    windFilter: null,
    windHighpass: null,
    windGain: null,
    windPhase: 0,

    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.82;
      this.master.connect(this.ctx.destination);

      for (let i = 0; i < 10; i++) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(this.master);
        osc.start();
        this.voices.push({ osc, gain });
      }

      // Continuous procedural wind noise.
      const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

      this.windSource = this.ctx.createBufferSource();
      this.windSource.buffer = buffer;
      this.windSource.loop = true;

      this.windFilter = this.ctx.createBiquadFilter();
      this.windFilter.type = "lowpass";
      this.windFilter.frequency.value = 850;
      this.windFilter.Q.value = 0.18;

      this.windGain = this.ctx.createGain();
      this.windGain.gain.value = 0;

      this.windHighpass = this.ctx.createBiquadFilter();
      this.windHighpass.type = "highpass";
      this.windHighpass.frequency.value = 120;
      this.windHighpass.Q.value = 0.2;

      this.windSource.connect(this.windHighpass);
      this.windHighpass.connect(this.windFilter);
      this.windFilter.connect(this.windGain);
      this.windGain.connect(this.master);
      this.windSource.start();

      MusicSys.init(this.ctx, this.master);
    },

    resume() {
      if (!this.ctx) return Promise.resolve();

      if (this.ctx.state === "suspended") {
        return this.ctx.resume();
      }

      return Promise.resolve();
    },

    blip(freq, duration = 0.07, gainValue = 0.08, type = "triangle") {
      if (!this.ctx || this.muted || this.voices.length === 0) return;

      const voice = this.voices[this.index++ % this.voices.length];
      const now = this.ctx.currentTime;
      voice.osc.type = type;

      voice.osc.frequency.cancelScheduledValues(now);
      voice.osc.frequency.setValueAtTime(freq, now);

      voice.gain.gain.cancelScheduledValues(now);
      voice.gain.gain.setValueAtTime(0.0001, now);
      voice.gain.gain.exponentialRampToValueAtTime(gainValue, now + 0.008);
      voice.gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    },

    setWind(amount) {
      if (!this.ctx || !this.windGain || !this.windFilter) return;

      const now = this.ctx.currentTime;
      const a = clamp(Math.abs(amount), 0, 1);

      // Gentle breath-like motion instead of harsh static.
      this.windPhase += 0.11;
      const flutter = 0.88 + Math.sin(this.windPhase) * 0.12;

      const targetGain = a * 0.085 * flutter;
      const targetFreq = 700 + a * 520 + Math.sin(this.windPhase * 0.73) * 90;

      this.windGain.gain.setTargetAtTime(targetGain, now, 0.18);
      this.windFilter.frequency.setTargetAtTime(targetFreq, now, 0.22);
    },

    land() { this.blip(180, 0.055, 0.17); },
    contact() {
      this.blip(235, 0.045, 0.10, "triangle");
      setTimeout(() => this.blip(185, 0.04, 0.065, "sine"), 22);
    },
    perfect() {
      this.blip(620, 0.07, 0.20);
      setTimeout(() => this.blip(820, 0.06, 0.16), 45);
    },
    // PHASE-1 — pooled comic squash sound, no new persistent audio nodes.
    squash() {
      this.blip(145, 0.085, 0.16, "triangle");
      setTimeout(() => this.blip(92, 0.055, 0.10, "square"), 28);
    },
    break() { this.blip(110, 0.12, 0.20, "square"); },
    crack() { this.blip(92, 0.18, 0.22, "sawtooth"); },
    shatter() {
      this.blip(210, 0.20, 0.18, "square");
      setTimeout(() => this.blip(470, 0.10, 0.12), 35);
    }
  };

  // Look-ahead procedural chiptune scheduler.
  const MusicSys = {
    ctx: null,
    out: null,
    musicBus: null,
    timer: null,
    nextNoteTime: 0,
    step: 0,
    running: false,
    noiseBuffer: null,

    // Original retro-RPG progression in A minor.
    // 16-step bars: Am - F - C - G with a faster upper-register melody.
    chords: [
      [220.00, 261.63, 329.63], // Am
      [174.61, 220.00, 261.63], // F
      [261.63, 329.63, 392.00], // C
      [196.00, 246.94, 293.66]  // G
    ],

    // Original melody contour; values are chord-tone / passing-tone semitone offsets.
    melodyOffsets: [
       0,  3,  7, 12,
       7, 10,  7,  3,
       0,  3,  5,  7,
      10,  7,  5,  3,

       0,  5,  9, 12,
       9,  5,  2,  5,
       0,  5,  7,  9,
      12,  9,  7,  5
    ],

    init(ctx, master) {
      if (this.ctx) return;

      this.ctx = ctx;

      this.musicBus = ctx.createGain();
      this.musicBus.gain.value = 0.62;
      this.musicBus.connect(master);

      // Gentle low-pass keeps the 8-bit sound lively without becoming harsh.
      this.out = ctx.createBiquadFilter();
      this.out.type = "lowpass";
      this.out.frequency.value = 5200;
      this.out.Q.value = 0.35;
      this.out.connect(this.musicBus);

      this.noiseBuffer = ctx.createBuffer(
        1,
        Math.floor(ctx.sampleRate * 0.14),
        ctx.sampleRate
      );

      const d = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      }

      this.nextNoteTime = ctx.currentTime + 0.06;
      this.timer = setInterval(() => this.schedule(), 25);
    },

    start() {
      if (!this.ctx) return;

      this.running = true;
      this.step = 0;
      this.nextNoteTime = this.ctx.currentTime + 0.06;

      // Schedule immediately after the user gesture / AudioContext resume.
      this.schedule();

      // Some mobile browsers need one more scheduling pass after resume.
      setTimeout(() => {
        if (this.running && this.ctx && this.ctx.state === "running") {
          this.nextNoteTime = Math.max(
            this.nextNoteTime,
            this.ctx.currentTime + 0.03
          );
          this.schedule();
        }
      }, 80);
    },

    stop() {
      this.running = false;
    },

    schedule() {
      if (!this.ctx || !this.running || STATE.mode !== MODE.PLAYING) return;

      // Quick, restless retro-RPG pulse.
      // Tempo responds slightly to the run but stops increasing once gameplay speed caps.
      const speedRatio = clamp((STATE.scrollSpeed - 205) / (292 - 205), 0, 1);
      const bpm = 148 + speedRatio * 16;
      const sixteenth = 60 / bpm / 4;

      while (this.nextNoteTime < this.ctx.currentTime + 0.14) {
        const step = this.step;
        const bar = Math.floor(step / 16) % 4;
        const chord = this.chords[bar];

        // 8-bit piano arpeggio underneath.
        const arpIndex = step % 4;
        const arpFreq = chord[arpIndex % 3] * (arpIndex === 3 ? 2 : 1);
        this.pianoNote(
          arpFreq,
          this.nextNoteTime,
          sixteenth * 1.55,
          0.034,
          step % 4 === 0
        );

        // Bass on eighth notes.
        if (step % 2 === 0) {
          this.bassNote(
            chord[0] / 2,
            this.nextNoteTime,
            sixteenth * 1.8,
            0.036
          );
        }

        // Original high melody, every eighth with occasional sixteenth pickup.
        if (step % 2 === 0 || step % 8 === 7) {
          const sequenceIndex = step % this.melodyOffsets.length;
          const offset = this.melodyOffsets[sequenceIndex];
          const root = bar === 0 ? 440.00 :
                       bar === 1 ? 349.23 :
                       bar === 2 ? 523.25 :
                                   392.00;
          const melodyFreq = root * Math.pow(2, offset / 12);

          this.pianoNote(
            melodyFreq,
            this.nextNoteTime,
            sixteenth * 1.25,
            step % 4 === 0 ? 0.044 : 0.033,
            true
          );
        }

        // Percussive running pulse.
        if (step % 4 === 0) this.kick(this.nextNoteTime);
        if (step % 8 === 4) this.snare(this.nextNoteTime);
        if (step % 2 === 1) this.hat(this.nextNoteTime, 0.016);

        this.step++;
        this.nextNoteTime += sixteenth;
      }
    },

    pianoNote(freq, time, duration, amount, bright = false) {
      if (!this.ctx || AudioSys.muted) return;

      // Two oscillators create a short pseudo-piano / chiptune attack.
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc1.type = "square";
      osc2.type = "triangle";

      osc1.frequency.setValueAtTime(freq, time);
      osc2.frequency.setValueAtTime(freq * 2, time);

      const peak = bright ? amount : amount * 0.82;

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(peak, time + 0.006);
      gain.gain.exponentialRampToValueAtTime(peak * 0.32, time + 0.035);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(this.out);

      osc1.start(time);
      osc2.start(time);
      osc1.stop(time + duration + 0.025);
      osc2.stop(time + duration + 0.025);
    },

    bassNote(freq, time, duration, amount) {
      if (!this.ctx || AudioSys.muted) return;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, time);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(amount, time + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      osc.connect(gain);
      gain.connect(this.out);

      osc.start(time);
      osc.stop(time + duration + 0.02);
    },

    kick(time) {
      if (!this.ctx || AudioSys.muted) return;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(132, time);
      osc.frequency.exponentialRampToValueAtTime(46, time + 0.075);

      gain.gain.setValueAtTime(0.060, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.095);

      osc.connect(gain);
      gain.connect(this.out);
      osc.start(time);
      osc.stop(time + 0.11);
    },

    snare(time) {
      if (!this.ctx || AudioSys.muted || !this.noiseBuffer) return;

      const src = this.ctx.createBufferSource();
      const hp = this.ctx.createBiquadFilter();
      const gain = this.ctx.createGain();

      src.buffer = this.noiseBuffer;
      hp.type = "highpass";
      hp.frequency.setValueAtTime(1300, time);

      gain.gain.setValueAtTime(0.032, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.075);

      src.connect(hp);
      hp.connect(gain);
      gain.connect(this.out);

      src.start(time);
      src.stop(time + 0.085);
    },

    hat(time, amount) {
      if (!this.ctx || AudioSys.muted || !this.noiseBuffer) return;

      const src = this.ctx.createBufferSource();
      const hp = this.ctx.createBiquadFilter();
      const gain = this.ctx.createGain();

      src.buffer = this.noiseBuffer;
      hp.type = "highpass";
      hp.frequency.setValueAtTime(5600, time);

      gain.gain.setValueAtTime(amount, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.026);

      src.connect(hp);
      hp.connect(gain);
      gain.connect(this.out);

      src.start(time);
      src.stop(time + 0.03);
    }
  };

  // ============================================================
  // 2) PARTICLE POOL — frame başına allocation yok
  // ============================================================
  const PARTICLE_MAX = 120;
  const particles = Array.from({ length: PARTICLE_MAX }, () => ({
    active: false,
    x: 0, y: 0,
    vx: 0, vy: 0,
    life: 0,
    maxLife: 0,
    size: 0
  }));
  let particleCursor = 0;

  function spawnParticle(x, y, vx, vy, life, size) {
    const p = particles[particleCursor++ % PARTICLE_MAX];
    p.active = true;
    p.x = x;
    p.y = y;
    p.vx = vx;
    p.vy = vy;
    p.life = life;
    p.maxLife = life;
    p.size = size;
  }

  function burst(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU;
      const speed = 45 + (i % 3) * 18;
      spawnParticle(
        x,
        y,
        Math.cos(a) * speed,
        Math.sin(a) * speed - 20,
        0.35 + (i % 2) * 0.10,
        2 + (i % 3)
      );
    }
  }


  // PHASE-0 — compatibility wrapper over the EXISTING particle pool.
  // No new per-frame particle allocations are introduced.
  const ParticleSys = {
    spawn(x, y, options = {}) {
      const count = options.count ?? 1;
      const color = options.color || "#6d8b63";
      for (let i = 0; i < count; i++) {
        const angle = STATE.rng() * TAU;
        const speed = (options.speedMin ?? 35) +
          STATE.rng() * ((options.speedMax ?? 90) - (options.speedMin ?? 35));

        spawnParticle(
          x,
          y,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed - (options.lift ?? 20),
          (options.lifeMin ?? 0.24) +
            STATE.rng() * ((options.lifeMax ?? 0.42) - (options.lifeMin ?? 0.24)),
          (options.sizeMin ?? 2) +
            STATE.rng() * ((options.sizeMax ?? 4) - (options.sizeMin ?? 2))
        );
      }
      // Existing particle renderer is single-color; keep requested enemy color
      // as metadata for future renderer upgrades without allocating new nodes.
      this.lastColor = color;
    },
    lastColor: "#6d8b63"
  };

  // Current game does not have a separate wind-particle pool; preserve the
  // existing wind renderer through this compatibility handle.
  const WindParticleSys = {
    activeCount: 0
  };

  // Compatibility alias for systems that refer to the platform array directly.
  // STATE.platforms is never reassigned; only its contents are mutated.
  let platforms = STATE.platforms;

  function updateParticles(dt) {
    for (const p of particles) {
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) {
        p.active = false;
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;
    }
  }

  // ============================================================
  // 3) POPUP POOL
  // ============================================================
  for (let i = 0; i < 24; i++) {
    STATE.popupPool.push({
      active: false,
      text: "",
      x: 0,
      y: 0,
      life: 0,
      maxLife: 0,
      kind: "normal"
    });
  }

  function popup(text, x, y, kind = "normal") {
    const slot = STATE.popupPool.find(p => !p.active) || STATE.popupPool[0];
    slot.active = true;
    slot.text = text;
    slot.x = x;
    slot.y = y;
    slot.life = 0.72;
    slot.maxLife = 0.72;
    slot.kind = kind;
  }

  function updatePopups(dt) {
    for (const p of STATE.popupPool) {
      if (!p.active) continue;
      p.life -= dt;
      p.y -= 20 * dt;
      if (p.life <= 0) p.active = false;
    }
  }

  // ============================================================
  // 4) YARDIMCI FONKSİYONLAR
  // ============================================================
  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function comboMultiplier() {
    return Math.min(5, 1 + STATE.combo * 0.1);
  }

  function updateHUD() {
    STATE.multiplier = comboMultiplier();
    scoreEl.textContent = `SCORE ${Math.floor(STATE.score)}`;
    bestEl.textContent = `BEST ${Math.floor(STATE.best)}`;
  }

  function resetCombo() {
    STATE.combo = 0;
    STATE.multiplier = 1;
    updateHUD();
  }

  // ============================================================
  // 5) PLATFORM ÜRETİMİ
  // ============================================================
  function choosePlatformType() {
    const r = Math.random();

    let type;
    if (r < 0.54) type = TYPE.NORMAL;
    else if (r < 0.72) type = TYPE.MOVING;
    else if (r < 0.91) type = TYPE.FRAGILE;
    else type = TYPE.SPIKE; // ~9%

    const last = STATE.lastTypes[STATE.lastTypes.length - 1];
    const secondLast = STATE.lastTypes[STATE.lastTypes.length - 2];

    // Kesin kural: SPIKE asla arka arkaya gelemez.
    if (type === TYPE.SPIKE && last === TYPE.SPIKE) {
      type = TYPE.NORMAL;
    }

    // Fragile platformun hemen arkasına lazer koyma.
    // Oyuncu kırılabilir platformdan geçtikten sonra toparlanacak güvenli bir
    // yüzey görsün. Bir öncekinin de fragile olması durumunda lazeri büyük
    // ölçüde bastırıyoruz.
    if (type === TYPE.SPIKE && last === TYPE.FRAGILE) {
      type = Math.random() < 0.72 ? TYPE.NORMAL : TYPE.MOVING;
    } else if (
      type === TYPE.SPIKE &&
      secondLast === TYPE.FRAGILE &&
      Math.random() < 0.82
    ) {
      type = Math.random() < 0.68 ? TYPE.NORMAL : TYPE.MOVING;
    }

    // Son iki tip aynıysa, üçüncü aynı olamaz.
    if (last && secondLast && last === secondLast && type === last) {
      const safeTypes = [TYPE.NORMAL, TYPE.MOVING, TYPE.FRAGILE, TYPE.SPIKE]
        .filter(t => t !== last)
        .filter(t => !(t === TYPE.SPIKE && last === TYPE.SPIKE));

      type = safeTypes[Math.floor(Math.random() * safeTypes.length)];
    }

    STATE.lastTypes.push(type);
    if (STATE.lastTypes.length > 2) STATE.lastTypes.shift();

    return type;
  }


  // PHASE-0 — MİKROP DÜŞMAN NESNESİ
  class Enemy {
    constructor(platformRef) {
      this.id = STATE.nextEnemyId++;
      this.platformRef = platformRef;
      this.radius = 16;

      // PHASE-0 — enemy uses only the middle ~40% of the platform.
      // The platform itself is NEVER shortened for an enemy.
      this.patrolMin = Math.max(this.radius + 7, platformRef.w * 0.31);
      this.patrolMax = Math.min(
        platformRef.w - this.radius - 7,
        platformRef.w * 0.69
      );

      if (this.patrolMax <= this.patrolMin) {
        const center = platformRef.w * 0.5;
        this.patrolMin = center - 2;
        this.patrolMax = center + 2;
      }

      this.localX = this.patrolMin +
        STATE.rng() * Math.max(1, this.patrolMax - this.patrolMin);

      this.patrolDir = STATE.rng() < 0.5 ? -1 : 1;
      this.patrolSpeed = 22 + STATE.rng() * 18;

      this.x = platformRef.x + this.localX;
      this.y = platformRef.y - this.radius;
      this.prevX = this.x;
      this.prevY = this.y;

      this.active = true;
      this.squashed = false;
      this.squashTimer = 0;
      this.contactCooldownUntil = 0;
      this.squashDuration = 0.42;
      this.burnSeed = STATE.rng() * 1000;
      this.age = STATE.rng() * 3;
    }

    update(dt) {
      this.prevX = this.x;
      this.prevY = this.y;

      if (!this.platformRef || this.platformRef.broken) {
        this.active = false;
        return;
      }

      // GLUED-TO-PLATFORM RULE:
      // x/y are always rebuilt from platformRef + localX, even during death.
      // This prevents the creature or its burn/squash animation from
      // visually detaching while the platform scrolls or moves sideways.
      if (this.squashed) {
        this.squashTimer += dt;
        this.x = this.platformRef.x + this.localX;
        this.y = this.platformRef.y - this.radius;
        return;
      }

      if (!this.active) return;

      this.age += dt;
      this.localX += this.patrolDir * this.patrolSpeed * dt;

      if (this.localX <= this.patrolMin) {
        this.localX = this.patrolMin;
        this.patrolDir = 1;
      } else if (this.localX >= this.patrolMax) {
        this.localX = this.patrolMax;
        this.patrolDir = -1;
      }

      // Follow the platform's scroll + horizontal movement exactly.
      this.x = this.platformRef.x + this.localX;
      this.y = this.platformRef.y - this.radius;
    }
  }

  function activeEnemyCount() {
    let count = 0;
    for (const e of STATE.enemies) if (e.active && !e.squashed) count++;
    return count;
  }

  function maybeSpawnEnemy(platform) {
    if (!platform) return;
    if (platform.type !== TYPE.NORMAL && platform.type !== TYPE.MOVING) return;
    if (platform.noEnemy) return;
    if (activeEnemyCount() >= 8) return;

    // Enemy cadence is platform-based instead of probability-based.
    // After one enemy spawns, the next can appear only after 7–17
    // eligible platforms have been generated.
    if (STATE.enemyPlatformsUntilNext > 0) {
      STATE.enemyPlatformsUntilNext--;
      return;
    }

    STATE.enemies.push(new Enemy(platform));

    // Deterministic 7–17 platform gap using STATE.rng().
    STATE.enemyPlatformsUntilNext = 7 + Math.floor(STATE.rng() * 11);
  }

  function updateEnemies(dt) {
    for (const enemy of STATE.enemies) enemy.update(dt);

    // PHASE-1 — show the hint only when an enemy becomes genuinely visible.
    // Pre-generated off-screen enemies do not consume the one-time hint.
    if (!STATE.hasSeenEnemyHint) {
      for (const enemy of STATE.enemies) {
        if (
          enemy.active &&
          !enemy.squashed &&
          enemy.y + enemy.radius >= 34 &&
          enemy.y - enemy.radius <= H - 28
        ) {
          STATE.hasSeenEnemyHint = true;
          STATE.enemyHintEnemyId = enemy.id;
          STATE.enemyHintTimer = STATE.enemyHintDuration;
          localStorage.setItem("paperFallEnemyHintSeen", "1");
          break;
        }
      }
    }

    if (STATE.enemyHintTimer > 0) {
      STATE.enemyHintTimer = Math.max(0, STATE.enemyHintTimer - dt);
      if (STATE.enemyHintTimer <= 0) {
        STATE.enemyHintEnemyId = null;
      }
    }

    const livingPlatformIds = new Set(
      STATE.platforms.filter(p => !p.broken).map(p => p.id)
    );

    STATE.enemies = STATE.enemies.filter(enemy => {
      if (!enemy.platformRef || !livingPlatformIds.has(enemy.platformRef.id)) {
        return false;
      }

      if (enemy.squashed) {
        // Death animation stays glued to the host platform until it fades.
        return enemy.squashTimer < enemy.squashDuration;
      }

      // IMPORTANT: keep enemies that are still below the screen.
      // Their host platforms are pre-generated off-screen and scroll upward.
      // Removing enemy.y > H here made almost every enemy disappear before
      // the player could ever see it.
      return enemy.active && enemy.platformRef.y > -120;
    });
  }

  function createPlatform(type, x, y, w) {
    return {
      id: STATE.nextPlatformId++,
      type,

      x,
      y,
      prevX: x,
      prevY: y,

      w,
      h: IS_MOBILE ? 16 : 15,

      moveDir: Math.random() < 0.5 ? -1 : 1,
      moveSpeed: 65 + Math.random() * 45,

      fragileTriggered: false,
      fragileTimer: 0,
      broken: false,
      breakAnim: 0,
      breakPieces: [],

      nearMissGranted: false,
      perfectGranted: false,
      noEnemy: false,

      // visual feedback only
      impact: 0,
      wobble: 0,
      wobbleVel: 0,
      bounce: 0,
      bounceVel: 0
    };
  }

  // Pozitif kök:
  // 0.5*g*t² + (scrollSpeed - jumpVelocity)*t - gap = 0
  function flightTimeToGap(gap, scrollSpeed) {
    const a = 0.5 * PLAYER.gravity;
    const b = scrollSpeed - PLAYER.jumpVelocity;
    const c = -gap;

    const disc = b * b - 4 * a * c;
    if (disc < 0) return Infinity;

    const t1 = (-b + Math.sqrt(disc)) / (2 * a);
    const t2 = (-b - Math.sqrt(disc)) / (2 * a);

    const positives = [t1, t2].filter(t => t > 0);
    return positives.length ? Math.min(...positives) : Infinity;
  }

  function chooseReachableGap() {
    // Mobile gets more breathing room so the screen is not packed
    // with platforms. Desktop keeps the previous density.
    const minGap = IS_MOBILE ? 150 : 110;
    const maxGap = IS_MOBILE ? 194 : 148;

    // Still validate each new platform against the CURRENT scroll speed.
    for (let attempt = 0; attempt < 24; attempt++) {
      const gap = minGap + Math.random() * (maxGap - minGap);
      const t = flightTimeToGap(gap, STATE.scrollSpeed);

      if (Number.isFinite(t) && t >= 0.20 && t <= 1.02) {
        return gap;
      }
    }

    return IS_MOBILE ? 166 : 132;
  }

  // PHASE-0
  // PLATFORM GENİŞLİĞİ REGRESYONU DÜZELTMESİ
  // Enemy sistemi platform genişliğini ASLA değiştirmez.
  // Geniş platform dağılımı korunur: 88 <= w < 154.
  const PLATFORM_WIDTH_MIN = IS_MOBILE ? 92 : 88;
  const PLATFORM_WIDTH_RANGE = IS_MOBILE ? 68 : 66;

  function spawnNextPlatform() {
    // Batch yok: her çağrıda SADECE 1 platform.
    const lowest = STATE.platforms.reduce((best, p) => {
      if (p.broken) return best;
      return (!best || p.y > best.y) ? p : best;
    }, null);

    const baseY = lowest ? lowest.y : H * 0.72;
    const gap = chooseReachableGap();
    const y = baseY + gap;

    const w = PLATFORM_WIDTH_MIN + Math.random() * PLATFORM_WIDTH_RANGE;
    let x = 20 + Math.random() * (W - w - 40);

    // Mobile visual spacing:
    // avoid repeatedly spawning platforms on almost the same vertical line.
    if (IS_MOBILE && STATE.lastSpawnCenterX !== null) {
      const minCenterSeparation = Math.min(78, W * 0.17);
      let bestX = x;
      let bestSep = Math.abs((x + w * 0.5) - STATE.lastSpawnCenterX);

      for (let attempt = 0; attempt < 8; attempt++) {
        const candidateX = 18 + Math.random() * (W - w - 36);
        const center = candidateX + w * 0.5;
        const sep = Math.abs(center - STATE.lastSpawnCenterX);

        if (sep > bestSep) {
          bestSep = sep;
          bestX = candidateX;
        }
        if (sep >= minCenterSeparation) {
          bestX = candidateX;
          break;
        }
      }

      x = bestX;
    }

    STATE.lastSpawnCenterX = x + w * 0.5;
    const type = choosePlatformType();

    const platform = createPlatform(type, x, y, w);
    STATE.platforms.push(platform);
    maybeSpawnEnemy(platform);
  }

  function buildInitialPlatforms() {
    STATE.platforms.length = 0;
    STATE.lastTypes.length = 0;
    STATE.nextPlatformId = 1;
    STATE.lastSpawnCenterX = null;

    // PHASE-3 — tutorial/start platform is always enemy-free.
    STATE.enemies.length = 0;
    STATE.recentEnemyPlatforms.length = 0;
    STATE.nextEnemyId = 1;
    STATE.enemyPlatformsUntilNext = 7 + Math.floor(STATE.rng() * 11);

    const startW = IS_MOBILE ? 156 : 150;
    const startY = IS_MOBILE ? Math.min(H * 0.58, 610) : H * 0.66;
    const tutorialPlatform =
      createPlatform(TYPE.NORMAL, W * 0.5 - startW * 0.5, startY, startW);
    tutorialPlatform.noEnemy = true;
    STATE.platforms.push(tutorialPlatform);
    STATE.lastSpawnCenterX = tutorialPlatform.x + tutorialPlatform.w * 0.5;

    // Başlangıçta sadece ekranı dolduracak kadar.
    // Her gap yine ayrı ayrı güncel hesapla oluşturuluyor.
    const initialPlatformCount = IS_MOBILE ? 7 : 14;
    for (let i = 0; i < initialPlatformCount; i++) {
      spawnNextPlatform();
    }
  }

  function maybeSpawnOnePlatform() {
    let lowestY = -Infinity;

    for (const p of STATE.platforms) {
      if (!p.broken && p.y > lowestY) lowestY = p.y;
    }

    // Platforms are generated only from scroll progression, never because
    // the player is falling or because the visible count became low.
    // Keep a modest off-screen runway so nothing can feel like a rescue spawn.
    let spawnGuard = 0;
    const platformBuffer = IS_MOBILE ? 115 : 190;

    while (lowestY < H + platformBuffer && spawnGuard < (IS_MOBILE ? 2 : 3)) {
      spawnNextPlatform();
      const newest = STATE.platforms[STATE.platforms.length - 1];
      lowestY = newest ? newest.y : lowestY;
      spawnGuard++;
    }
  }


  // ============================================================
  // 5B) WIND EVENT — warning first, then full-screen strong wind
  // ============================================================
  function maybeSpawnWindZone() {
    if (STATE.windEvent) return;
    if (STATE.score < STATE.nextWindSpawnScore) return;

    // Wind cadence: regular enough to be part of the run, but not spammy.
    // Once the score threshold is reached, the event WILL happen instead of
    // failing a second random roll and disappearing for another long interval.
    STATE.nextWindSpawnScore = STATE.score + 430 + Math.random() * 390;

    const dir = Math.random() < 0.5 ? -1 : 1;

    const warningDuration = 1.65;
    const activeDuration = 3.5 + Math.random() * 0.5;

    // Wind difficulty scales with progress instead of starting strong.
    // Early run: gentle nudge. Late run: noticeable, but capped so it never
    // overrides normal drag control or ruins a landing by itself.
    const windProgress = clamp(STATE.score / 3200, 0, 1);
    const windEase = windProgress * windProgress * (3 - 2 * windProgress);
    const windStrength = lerp(255, 465, windEase) + Math.random() * 20;

    STATE.windEvent = {
      id: STATE.windSerial++,
      phase: "warning",
      timer: 0,
      warningDuration,
      activeDuration,
      totalDuration: warningDuration + activeDuration,
      startedAt: STATE.time,
      endsAt: STATE.time + warningDuration + activeDuration + 0.08,
      dir,
      strength: windStrength
    };

    // Keep winds array empty; fullscreen event is not tied to world Y.
    STATE.winds.length = 0;
  }

  function finishWindEvent() {
    STATE.windEvent = null;
    STATE.winds.length = 0;
    STATE.windVisual = 0;

    // Clear every gameplay/render/audio residue from the wind.
    PLAYER.windVX = 0;
    PLAYER.windOffset = 0;

    if (AudioSys.ctx) {
      AudioSys.setWind(0);

      if (AudioSys.windGain) {
        const now = AudioSys.ctx.currentTime;
        AudioSys.windGain.gain.cancelScheduledValues(now);
        AudioSys.windGain.gain.setValueAtTime(0, now);
      }

      if (AudioSys.windFilter) {
        const now = AudioSys.ctx.currentTime;
        AudioSys.windFilter.frequency.cancelScheduledValues(now);
      }
    }
  }

  function updateWindZones(dt) {
    maybeSpawnWindZone();

    const e = STATE.windEvent;
    if (!e) return;

    // Hard stale-state guard.
    if (
      !Number.isFinite(e.timer) ||
      !Number.isFinite(e.startedAt) ||
      !Number.isFinite(e.endsAt) ||
      STATE.time >= e.endsAt ||
      (e.phase !== "warning" && e.phase !== "active") ||
      (e.phase === "active" && e.timer >= e.activeDuration)
    ) {
      finishWindEvent();
      return;
    }

    e.timer += dt;

    if ((STATE.time - e.startedAt) >= e.totalDuration + 0.08) {
      finishWindEvent();
      return;
    }

    if (e.phase === "warning" && e.timer >= e.warningDuration) {
      e.phase = "active";
      e.timer = 0;
      STATE.windVisual = 1;
    } else if (e.phase === "active" && e.timer >= e.activeDuration) {
      finishWindEvent();
      return;
    }
  }

  function windFlowEnvelope(e) {
    if (!e || e.phase !== "active") {
      return { amount: 0, enter: 0, exit: 0 };
    }

    const enterDuration = 0.72;
    const exitDuration = 0.82;

    const enter = clamp(e.timer / enterDuration, 0, 1);
    const timeLeft = Math.max(0, e.activeDuration - e.timer);
    const exit = clamp(timeLeft / exitDuration, 0, 1);

    // Smoothstep on both sides prevents a sudden start/stop.
    const enterSmooth = enter * enter * (3 - 2 * enter);
    const exitSmooth = exit * exit * (3 - 2 * exit);
    const amount = Math.min(enterSmooth, exitSmooth);

    return {
      amount,
      enter: enterSmooth,
      exit: exitSmooth
    };
  }

  function applyWindToPlayer(dt) {
    const e = STATE.windEvent;

    if (STATE.mode !== MODE.PLAYING) {
      if (e) finishWindEvent();
      else {
        PLAYER.windVX = 0;
        PLAYER.windOffset = 0;
        AudioSys.setWind(0);
      }
      return;
    }

    if (!e || e.phase !== "active") {
      STATE.windVisual = 0;
      PLAYER.windVX = 0;
      PLAYER.windOffset = 0;
      AudioSys.setWind(0);
      return;
    }

    const flow = windFlowEnvelope(e);
    STATE.windVisual = flow.amount;

    // Wind now physically arrives from one side, builds up smoothly,
    // then fades while travelling out through the opposite side.
    const pulse = 0.95 + 0.05 * Math.sin(STATE.time * 3.2);
    const pushSpeed = e.strength * pulse * 0.32 * flow.amount;

    PLAYER.targetX += e.dir * pushSpeed * dt;
    PLAYER.targetX = clamp(PLAYER.targetX, PLAYER.radius, W - PLAYER.radius);

    PLAYER.windVX = e.dir * pushSpeed;
    PLAYER.windOffset = 0;

    AudioSys.setWind(flow.amount);
  }

  // ============================================================
  // 6) OYUN RESET / START / GAME OVER
  // ============================================================
  function resetGame() {
    STATE.time = 0;
    STATE.score = 0;

    // PHASE-3 — deterministic enemy sequence for this run.
    // Ghost/replay code can call STATE.setRunSeed(savedSeed) before rebuild.
    const nextSeed = ((Date.now() ^ Math.floor(performance.now() * 1000)) >>> 0) || 1;
    STATE.setRunSeed(nextSeed);
    STATE.combo = 0;
    STATE.multiplier = 1;
    STATE.scrollSpeed = 205;
    STATE.lastLandingPlatformY = null;
    STATE.nearMissCooldownUntil = 0;
    STATE.winds.length = 0;
    STATE.windEvent = null;
    PLAYER.windVX = 0;
    PLAYER.windOffset = 0;
    STATE.nextWindSpawnScore = 300 + Math.random() * 220;
    STATE.windSerial = 1;
    STATE.deathTimer = 0;
    STATE.deathPhase = 0;
    STATE.deathReason = "";
    STATE.deathPieces.length = 0;
    STATE.deathDust.length = 0;
    STATE.deathImpact = 0;
    STATE.reviveUsed = false;
    STATE.reviveTimer = 0;
    STATE.reviveReadyTimer = 0;
    STATE.invincibleTimer = 0;
    STATE.windVisual = 0;
    STATE.impactShake = 0;
    STATE.speedPulse = 0;
    STATE.landingFlash = 0;
    STATE.runDistance = 0;
    STATE.renderAlpha = 1;
    STATE.themeFromIndex = 0;
    STATE.themeToIndex = 0;
    STATE.themeTransition = 1;
    STATE.tutorialTime = 0;
    buildThemeThresholds();

    for (const p of particles) p.active = false;
    for (const p of STATE.popupPool) p.active = false;

    PLAYER.x = W * 0.5;
    PLAYER.targetX = W * 0.5;
    PLAYER.prevX = PLAYER.x;

    PLAYER.y = IS_MOBILE ? Math.min(H * 0.27, 300) : H * 0.32;
    PLAYER.prevY = PLAYER.y;
    PLAYER.vy = 0;
    PLAYER.vx = 0;
    PLAYER.alive = true;
    PLAYER.windOffset = 0;
    PLAYER.windVX = 0;
    PLAYER.visualVX = 0;
    PLAYER.visualTilt = 0;
    PLAYER.squash = 0;
    PLAYER.stretch = 0;
    PLAYER.lastBouncePlatformId = null;

    finishWindEvent();
    buildInitialPlatforms();
    updateHUD();
  }

  function startGame() {
    AudioSys.init();

    resetGame();
    STATE.mode = MODE.TUTORIAL;
    PLAYER.targetX = W * 0.5;
    overlay.style.display = "none";
    reviveCountdown.style.display = "none";
    reviveBtn.style.display = "none";
    playBtn.style.display = "block";
    document.getElementById("hud").style.display = "none";
    muteBtn.style.display = "none";

    AudioSys.resume().catch(() => {});
  }

  function beginActualRun() {
    if (STATE.mode !== MODE.TUTORIAL) return;

    STATE.mode = MODE.PLAYING;
    STATE.flickHintTimer = 5.2;
    PLAYER.vy = 80;
    PLAYER.prevY = PLAYER.y;

    document.getElementById("hud").style.display = "flex";

    AudioSys.resume()
      .then(() => {
        if (!AudioSys.ctx || AudioSys.ctx.state !== "running") return;
        MusicSys.start();
        if (!AudioSys.muted) {
          AudioSys.blip(523.25, 0.07, 0.11);
        }
      })
      .catch(() => {});
  }

  function beginDeath(reason) {
    if (STATE.mode !== MODE.PLAYING) return;
    if (STATE.invincibleTimer > 0) return;

    STATE.mode = MODE.DEATH;
    STATE.deathTimer = 0;
    STATE.deathPhase = 0;
    STATE.deathReason = reason;
    STATE.deathImpact = 1;

    PLAYER.alive = false;
    PLAYER.vy = 0;
    PLAYER.windVX = 0;
    finishWindEvent();
    AudioSys.crack();

    resetCombo();
  }

  function buildDeathPieces() {
    STATE.deathPieces.length = 0;
    STATE.deathDust.length = 0;

    // Fewer, chunkier pieces read much better than many tiny wedges.
    const rings = [
      { r0: 0, r1: PLAYER.radius * 0.52, count: 5 },
      { r0: PLAYER.radius * 0.44, r1: PLAYER.radius, count: 9 }
    ];

    for (const ring of rings) {
      const offset = STATE.rng() * TAU;

      for (let i = 0; i < ring.count; i++) {
        const jitter0 = (STATE.rng() - 0.5) * 0.10;
        const jitter1 = (STATE.rng() - 0.5) * 0.10;
        const a0 = offset + (i / ring.count) * TAU + jitter0;
        const a1 = offset + ((i + 1) / ring.count) * TAU + jitter1;
        const mid = (a0 + a1) * 0.5;

        const speed = 120 + STATE.rng() * 115;
        const upwardBias = 85 + STATE.rng() * 75;

        STATE.deathPieces.push({
          x: PLAYER.x,
          y: PLAYER.y,
          vx: Math.cos(mid) * speed,
          vy: Math.sin(mid) * speed - upwardBias,
          rot: 0,
          vr: -7 + STATE.rng() * 14,
          a0, a1,
          r0: ring.r0,
          r1: ring.r1,
          alpha: 1,
          scale: 1,
          wobble: STATE.rng() * TAU
        });
      }
    }

    // Fine paper-dust motes around the shatter.
    for (let i = 0; i < 22; i++) {
      const a = STATE.rng() * TAU;
      const speed = 35 + STATE.rng() * 135;

      STATE.deathDust.push({
        x: PLAYER.x + (STATE.rng() - 0.5) * PLAYER.radius,
        y: PLAYER.y + (STATE.rng() - 0.5) * PLAYER.radius,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 35 - STATE.rng() * 60,
        life: 0.38 + STATE.rng() * 0.48,
        maxLife: 0,
        size: 1.2 + STATE.rng() * 2.8
      });
      STATE.deathDust[STATE.deathDust.length - 1].maxLife =
        STATE.deathDust[STATE.deathDust.length - 1].life;
    }

    AudioSys.shatter();
  }

  function updateDeath(dt) {
    STATE.deathTimer += dt;
    updateParticles(dt);
    updatePopups(dt);

    if (STATE.deathPhase === 0) {
      if (STATE.deathTimer >= 0.48) {
        STATE.deathPhase = 1;
        STATE.deathTimer = 0;
        buildDeathPieces();
      }
      return;
    }

    STATE.deathImpact *= Math.max(0, 1 - 10 * dt);

    for (const q of STATE.deathPieces) {
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.vy += 560 * dt;
      q.vx *= Math.max(0, 1 - 0.8 * dt);
      q.rot += q.vr * dt;

      q.alpha = Math.max(0, 1 - Math.max(0, STATE.deathTimer - 0.54) / 0.58);
      q.scale = 1 - Math.max(0, STATE.deathTimer - 0.64) * 0.22;
    }

    for (const d of STATE.deathDust) {
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.vy += 240 * dt;
      d.vx *= Math.max(0, 1 - 1.8 * dt);
      d.life = Math.max(0, d.life - dt);
    }

    if (STATE.deathTimer >= 1.15) {
      if (!STATE.reviveUsed) showRevivePrompt();
      else showGameOver();
    }
  }

  function showRevivePrompt() {
    finishWindEvent();
    MusicSys.stop();

    STATE.mode = MODE.REVIVE;
    STATE.reviveTimer = STATE.reviveDuration;

    document.getElementById("hud").style.display = "none";
    muteBtn.style.display = "none";

    panelTitle.textContent = "CONTINUE?";
    panelText.innerHTML =
      `${STATE.deathReason}<br><br>` +
      `Score: <b>${Math.floor(STATE.score)}</b>`;

    reviveCountdown.style.display = "block";
    reviveCountdown.textContent = "5";
    reviveBtn.style.display = "block";
    playBtn.style.display = "none";
    overlay.style.display = "grid";
  }

  function updateRevive(dt) {
    finishWindEvent();

    STATE.reviveTimer = Math.max(0, STATE.reviveTimer - dt);
    reviveCountdown.textContent = String(Math.max(0, Math.ceil(STATE.reviveTimer)));

    updateParticles(dt);
    updatePopups(dt);

    if (STATE.reviveTimer <= 0) {
      showGameOver();
    }
  }

  function performRevive() {
    if (STATE.mode !== MODE.REVIVE || STATE.reviveUsed) return;

    STATE.reviveUsed = true;
    STATE.reviveTimer = 0;
    STATE.deathPieces.length = 0;
    finishWindEvent();

    // Remove hazards close to the revive area so the restart is genuinely safe.
    const safeY = IS_MOBILE ? Math.min(H * 0.62, 690) : H * 0.68;
    STATE.platforms = STATE.platforms.filter(p =>
      p.y < safeY - 150 || p.y > safeY + 150
    );

    const safeW = IS_MOBILE ? 186 : 180;
    const safeX = clamp(W * 0.5 - safeW * 0.5, 18, W - safeW - 18);
    const safePlatform = createPlatform(TYPE.NORMAL, safeX, safeY, safeW);
    safePlatform.perfectGranted = true;
    safePlatform.noEnemy = true;
    STATE.platforms.push(safePlatform);

    PLAYER.x = W * 0.5;
    PLAYER.prevX = PLAYER.x;
    PLAYER.targetX = PLAYER.x;
    PLAYER.y = safeY - PLAYER.radius - 70;
    PLAYER.prevY = PLAYER.y;
    PLAYER.vy = 0;
    PLAYER.alive = true;
    PLAYER.lastBouncePlatformId = null;
    PLAYER.windVX = 0;
    PLAYER.windOffset = 0;

    STATE.invincibleTimer = 1.5;
    STATE.reviveReadyTimer = 3;
    STATE.mode = MODE.REVIVE_COUNTDOWN;

    // Keep scene visible and frozen while player prepares.
    overlay.style.display = "grid";
    panelTitle.textContent = "GET READY";
    panelText.innerHTML = "";
    reviveCountdown.style.display = "block";
    reviveCountdown.textContent = "3";
    reviveBtn.style.display = "none";
    playBtn.style.display = "none";
    document.getElementById("hud").style.display = "none";

    AudioSys.resume().catch(() => {});
  }

  function finishReviveCountdown() {
    if (STATE.mode !== MODE.REVIVE_COUNTDOWN) return;

    STATE.mode = MODE.PLAYING;
    PLAYER.vy = 70;
    PLAYER.prevY = PLAYER.y;

    overlay.style.display = "none";
    reviveCountdown.style.display = "none";
    reviveBtn.style.display = "none";
    playBtn.style.display = "block";
    document.getElementById("hud").style.display = "flex";

    AudioSys.resume()
      .then(() => {
        if (AudioSys.ctx && AudioSys.ctx.state === "running") {
          MusicSys.start();
          if (!AudioSys.muted) AudioSys.blip(659.25, 0.09, 0.14);
        }
      })
      .catch(() => {});
  }

  function updateReviveCountdown(dt) {
    finishWindEvent();

    STATE.reviveReadyTimer = Math.max(0, STATE.reviveReadyTimer - dt);
    reviveCountdown.textContent = String(
      Math.max(1, Math.ceil(STATE.reviveReadyTimer))
    );

    updateParticles(dt);
    updatePopups(dt);

    if (STATE.reviveReadyTimer <= 0) {
      finishReviveCountdown();
    }
  }

  function showGameOver() {
    STATE.mode = MODE.GAMEOVER;
    finishWindEvent();
    MusicSys.stop();
    document.getElementById("hud").style.display = "none";
    muteBtn.style.display = "grid";

    STATE.best = Math.max(STATE.best, STATE.score);
    localStorage.setItem("paperFallBest", String(Math.floor(STATE.best)));

    reviveCountdown.style.display = "none";
    reviveBtn.style.display = "none";
    playBtn.style.display = "block";

    panelTitle.textContent = "RUN OVER";
    panelText.innerHTML =
      `${STATE.deathReason}<br><br>` +
      `Score: <b>${Math.floor(STATE.score)}</b><br>` +
      `Best: <b>${Math.floor(STATE.best)}</b>`;
    playBtn.textContent = "RUN AGAIN";
    overlay.style.display = "grid";
  }

  // ============================================================
  // 7) PLATFORM GÜNCELLE — ÖNCE PLATFORM
  // ============================================================
  function shatterFragilePlatform(p, force = 1) {
    if (!p || p.type !== TYPE.FRAGILE || p.broken) return false;

    p.fragileTriggered = true;
    p.fragileTimer = 0;
    p.breakAnim = 1;
    p.broken = true;
    p.breakPieces.length = 0;

    const pieceCount = 6;
    const pieceW = p.w / pieceCount;

    for (let i = 0; i < pieceCount; i++) {
      const centerBias = i - (pieceCount - 1) / 2;
      p.breakPieces.push({
        x: p.x + i * pieceW,
        y: p.y,
        w: pieceW + 1,
        h: p.h,
        vx: centerBias * (30 + force * 10),
        vy: -42 - (i % 2) * 24 - force * 18,
        rot: 0,
        vr: centerBias * (1.7 + force * 0.35),
        alpha: 1,
        fade: 0.74 + i * 0.045
      });
    }

    burst(p.x + p.w * 0.5, p.y, 12);
    AudioSys.break();
    STATE.impactShake = Math.max(STATE.impactShake, 2.1 + force * 0.6);

    return true;
  }

  function updatePlatforms(dt) {
    for (const p of STATE.platforms) {
      p.prevX = p.x;
      p.prevY = p.y;

      p.y -= STATE.scrollSpeed * dt;

      if (p.type === TYPE.MOVING) {
        p.x += p.moveDir * p.moveSpeed * dt;

        if (p.x <= 10) {
          p.x = 10;
          p.moveDir = 1;
        } else if (p.x + p.w >= W - 10) {
          p.x = W - 10 - p.w;
          p.moveDir = -1;
        }
      }

      p.impact *= Math.max(0, 1 - 8.5 * dt);

      // Subtle physically-inspired platform response:
      // spring back from landings and side bumps.
      p.wobbleVel += (-p.wobble * 46 - p.wobbleVel * 8.8) * dt;
      p.wobble += p.wobbleVel * dt;

      p.bounceVel += (-p.bounce * 76 - p.bounceVel * 12.8) * dt;
      p.bounce += p.bounceVel * dt;

      if (p.type === TYPE.FRAGILE && p.fragileTriggered && !p.broken) {
        p.fragileTimer -= dt;
        p.breakAnim = Math.max(0, p.breakAnim - dt * 3.5);

        if (p.fragileTimer <= 0) {
          shatterFragilePlatform(p, 0.45);
        }
      }

      if (p.broken && p.breakPieces && p.breakPieces.length) {
        for (const q of p.breakPieces) {
          q.x += q.vx * dt;
          q.y += q.vy * dt;
          q.vy += 520 * dt;
          q.vx *= Math.max(0, 1 - 1.1 * dt);
          q.rot += q.vr * dt;

          // Fade away gently like dusty fragments.
          q.alpha = Math.max(0, q.alpha - q.fade * dt);
        }
      }
    }

    STATE.platforms = STATE.platforms.filter(p => {
      if (!p.broken) return p.y + p.h > -60;
      if (!p.breakPieces || !p.breakPieces.length) return false;
      return p.breakPieces.some(q => q.y < H + 90 && q.alpha > 0.03);
    });

    updateWindZones(dt);
    maybeSpawnOnePlatform();
  }

  // ============================================================
  // 8) OYUNCU GÜNCELLE — SONRA PLAYER
  // ============================================================
  function updatePlayer(dt) {
    INPUT.flickPulse *= Math.max(0, 1 - 18 * dt);
    STATE.flickHintTimer = Math.max(0, STATE.flickHintTimer - dt);
    INPUT.angryFaceTimer = Math.max(0, INPUT.angryFaceTimer - dt);

    if (INPUT.stompDashActive) {
      INPUT.stompDashTimer = Math.max(0, INPUT.stompDashTimer - dt);

      // Smooth stomp ramp: fast response without a one-frame speed snap.
      INPUT.stompDashRamp = Math.min(1, INPUT.stompDashRamp + dt / 0.10);
      const ramp = INPUT.stompDashRamp * INPUT.stompDashRamp *
        (3 - 2 * INPUT.stompDashRamp);
      const targetStompSpeed = lerp(520, INPUT.stompDashSpeed, ramp);

      PLAYER.vy = Math.max(PLAYER.vy, targetStompSpeed);

      PLAYER.squash = Math.max(PLAYER.squash, 0.18);
      PLAYER.stretch = Math.max(PLAYER.stretch, 0.16);
    }
    PLAYER.prevX = PLAYER.x;
    PLAYER.prevY = PLAYER.y;

    // 1:1 doğrudan kontrol:
    // pointer aktifken targetX doğrudan pointer konumudur.
    // keyboard yalnızca desktop test kolaylığı içindir.
    if (!INPUT.active && INPUT.keyboardDir !== 0) {
      PLAYER.targetX += INPUT.keyboardDir * INPUT.keyboardSpeed * dt;
    }

    // Short horizontal recoil from non-lethal microbe contact.
    if (Math.abs(PLAYER.vx) > 0.01) {
      PLAYER.targetX += PLAYER.vx * dt;
      PLAYER.vx *= Math.exp(-dt / 0.15);
      if (Math.abs(PLAYER.vx) < 2) PLAYER.vx = 0;
    }

    PLAYER.targetX = clamp(
      PLAYER.targetX,
      PLAYER.radius,
      W - PLAYER.radius
    );

    applyWindToPlayer(dt);

    const previousXBeforeMove = PLAYER.x;

    PLAYER.x = clamp(
      PLAYER.targetX,
      PLAYER.radius,
      W - PLAYER.radius
    );

    // Smooth visual velocity: gameplay remains direct and responsive,
    // but the character body reacts with believable inertia.
    const rawVX = (PLAYER.x - previousXBeforeMove) / Math.max(dt, 0.0001);
    PLAYER.visualVX += (rawVX - PLAYER.visualVX) * Math.min(1, 13 * dt);

    const targetTilt = clamp(PLAYER.visualVX / 1200, -1, 1) * 0.14;
    PLAYER.visualTilt += (targetTilt - PLAYER.visualTilt) * Math.min(1, 10 * dt);

    PLAYER.vy += PLAYER.gravity * dt;
    PLAYER.vy = Math.min(PLAYER.vy, PLAYER.maxFallSpeed);
    PLAYER.y += PLAYER.vy * dt;

    if (PLAYER.vy >= 0) {
      PLAYER.lastBouncePlatformId = null;
    }
  }


  function sweepPointVsExpandedRect(
    startX, startY,
    endX, endY,
    minX, minY,
    maxX, maxY
  ) {
    const dx = endX - startX;
    const dy = endY - startY;

    let txEntry = -Infinity;
    let txExit = Infinity;
    let tyEntry = -Infinity;
    let tyExit = Infinity;

    if (Math.abs(dx) < 1e-9) {
      if (startX < minX || startX > maxX) return null;
    } else {
      const tx1 = (minX - startX) / dx;
      const tx2 = (maxX - startX) / dx;
      txEntry = Math.min(tx1, tx2);
      txExit = Math.max(tx1, tx2);
    }

    if (Math.abs(dy) < 1e-9) {
      if (startY < minY || startY > maxY) return null;
    } else {
      const ty1 = (minY - startY) / dy;
      const ty2 = (maxY - startY) / dy;
      tyEntry = Math.min(ty1, ty2);
      tyExit = Math.max(ty1, ty2);
    }

    const entry = Math.max(txEntry, tyEntry);
    const exit = Math.min(txExit, tyExit);

    if (entry > exit || exit < 0 || entry > 1) return null;
    if (entry < 0) return null; // starting overlap handled separately

    let nx = 0, ny = 0;

    if (txEntry > tyEntry) {
      nx = dx > 0 ? -1 : 1;
    } else {
      ny = dy > 0 ? -1 : 1;
    }

    return { t: entry, nx, ny };
  }

  function laserBeamOverlap(cx, cy, r, p) {
    const beamPad = 8;
    const beamX = p.x + beamPad;
    const beamW = Math.max(14, p.w - beamPad * 2);
    const beamY = p.y - 7;
    const beamH = 9;

    const nearestX = clamp(cx, beamX, beamX + beamW);
    const nearestY = clamp(cy, beamY, beamY + beamH);
    const dx = cx - nearestX;
    const dy = cy - nearestY;
    return dx * dx + dy * dy < r * r;
  }

  function circleRectOverlap(cx, cy, r, p, spikeTop = false) {
    const top = spikeTop ? p.y - 16 : p.y;
    const nearestX = clamp(cx, p.x, p.x + p.w);
    const nearestY = clamp(cy, top, p.y + p.h);
    const dx = cx - nearestX;
    const dy = cy - nearestY;
    return dx * dx + dy * dy < r * r;
  }

  // ============================================================
  // 9) SOLID SWEPT COLLISION — top / sides / underside
  // ============================================================
  function sweptPlatformCollision() {
    const radius = PLAYER.radius;
    const skin = 1.5;

    let best = null;

    for (const p of STATE.platforms) {
      if (p.broken) continue;

      // Ignore only the SAME launch platform while the ball is rising.
      if (p.id === PLAYER.lastBouncePlatformId && PLAYER.vy < 0) continue;

      // Work in platform-local relative coordinates so moving platforms
      // are handled by the exact same sweep.
      const startX = PLAYER.prevX - p.prevX;
      const startY = PLAYER.prevY - p.prevY;
      const endX = PLAYER.x - p.x;
      const endY = PLAYER.y - p.y;

      // Laser platforms are solid bodies; only the top beam is deadly.
      const hazardTopOffset = 0;

      const hit = sweepPointVsExpandedRect(
        startX,
        startY,
        endX,
        endY,
        -radius - skin,
        hazardTopOffset - radius - skin,
        p.w + radius + skin,
        p.h + radius + skin
      );

      if (hit && (!best || hit.t < best.t)) {
        best = { p, ...hit };
      }
    }

    if (best) {
      const p = best.p;

      // Flick/stomp punches straight through a fragile platform.
      // No bounce and no solid correction: it shatters immediately and the
      // ball continues its downward dash through the opening.
      if (
        p.type === TYPE.FRAGILE &&
        INPUT.stompDashActive &&
        !INPUT.stompFragileBroken &&
        PLAYER.vy > 0
      ) {
        shatterFragilePlatform(p, 1.35);
        INPUT.stompFragileBroken = true;

        // Dash continues after the ONE allowed instant fragile break.
        PLAYER.vy = Math.max(PLAYER.vy, INPUT.stompDashSpeed * 0.88);
        PLAYER.stretch = Math.max(PLAYER.stretch, 0.20);
        PLAYER.squash = Math.max(PLAYER.squash, 0.16);
        return;
      }

      // Laser platforms only kill on the top beam, not from their sides/body.

      // Side impact: the platform is a REAL solid wall.
      // Stop the ball at the side and reset targetX there so continued
      // dragging cannot teleport it through the platform on the next step.
      if (best.nx !== 0) {
        INPUT.stompDashActive = false;
        INPUT.stompDashTimer = 0;
        INPUT.stompFragileBroken = false;
        INPUT.stompTargetId = null;

        if (best.nx < 0) {
          PLAYER.x = p.x - radius - skin;
        } else {
          PLAYER.x = p.x + p.w + radius + skin;
        }

        // Side bump gives the platform a visible but controlled wobble.
        p.wobbleVel += best.nx * -8.0;
        p.bounceVel += 1.8;

        PLAYER.targetX = PLAYER.x;
        PLAYER.prevX = PLAYER.x;
        PLAYER.windVX = 0;
        PLAYER.windOffset = 0;
      }

      // Landing on top.
      if (best.ny < 0) {
        if (p.type === TYPE.SPIKE) {
          INPUT.stompDashActive = false;
          INPUT.stompDashTimer = 0;
          INPUT.stompFragileBroken = false;
          beginDeath("You touched a laser.");
          return;
        }

        // A normal solid landing ends the persistent stomp.
        INPUT.stompDashActive = false;
        INPUT.stompDashTimer = 0;
        INPUT.stompFragileBroken = false;
        INPUT.stompTargetId = null;

        PLAYER.y = p.y - radius;
        PLAYER.prevY = PLAYER.y;

        const incomingSpeed = Math.max(0, PLAYER.vy);
        PLAYER.vy = -PLAYER.jumpVelocity;
        PLAYER.lastBouncePlatformId = p.id;

        p.impact = clamp(incomingSpeed / 760, 0.18, 0.72);
        p.bounceVel += clamp(incomingSpeed / 260, 1.2, 4.0);
        p.wobbleVel += clamp((PLAYER.x - (p.x + p.w * 0.5)) / (p.w * 0.5), -1, 1) * 6.2;

        PLAYER.squash = clamp(incomingSpeed / 820, 0.14, 0.42);
        PLAYER.stretch = -0.04;
        STATE.impactShake = Math.max(
          STATE.impactShake,
          0.8 + incomingSpeed * 0.0018
        );
        STATE.landingFlash = 0.09;

        const dustCount = 5 + Math.floor(clamp(incomingSpeed / 140, 0, 5));
        for (let i = 0; i < dustCount; i++) {
          const dir = i % 2 === 0 ? -1 : 1;
          spawnParticle(
            PLAYER.x + dir * (3 + (i % 3) * 3),
            PLAYER.y + PLAYER.radius - 1,
            dir * (35 + i * 7),
            -25 - (i % 3) * 12,
            0.24 + (i % 2) * 0.08,
            2 + (i % 2)
          );
        }

        if (p.type === TYPE.FRAGILE && !p.fragileTriggered) {
          p.fragileTriggered = true;
          p.fragileTimer = 0.16;
          p.breakAnim = 1;
        }

        const center = p.x + p.w * 0.5;
        const perfectHalfWidth = clamp(p.w * 0.15, 10, 22);

        if (
          !p.perfectGranted &&
          Math.abs(PLAYER.x - center) <= perfectHalfWidth
        ) {
          p.perfectGranted = true;
          STATE.score += 25;
          STATE.combo += 2;

          burst(PLAYER.x, PLAYER.y + PLAYER.radius, 9);
          STATE.impactShake = Math.max(STATE.impactShake, 2.2);
          STATE.speedPulse = 0.12;
          popup("PERFECT!", PLAYER.x, PLAYER.y - 24, "good");
          AudioSys.perfect();
        } else {
          AudioSys.land();
        }

        STATE.lastLandingPlatformY = p.y;
        updateHUD();
      }

      // Hit underside while rising: stop upward travel and keep the ball below.
      if (best.ny > 0) {
        INPUT.stompDashActive = false;
        INPUT.stompDashTimer = 0;
        INPUT.stompFragileBroken = false;
        INPUT.stompTargetId = null;

        PLAYER.y = p.y + p.h + radius + skin;
        PLAYER.prevY = PLAYER.y;
        if (PLAYER.vy < 0) PLAYER.vy = 0;
      }
    }

    // FINAL DEPENETRATION PASS:
    // No matter what happened during the frame, a normal platform is never
    // allowed to contain the ball. This is the hard guarantee.
    for (let pass = 0; pass < 3; pass++) {
      let corrected = false;

      for (const p of STATE.platforms) {
        if (p.broken) continue;

        if (
          p.type === TYPE.FRAGILE &&
          INPUT.stompDashActive &&
          !INPUT.stompFragileBroken &&
          PLAYER.vy > 0 &&
          circleRectOverlap(PLAYER.x, PLAYER.y, radius, p, false)
        ) {
          shatterFragilePlatform(p, 1.2);
          INPUT.stompFragileBroken = true;
          PLAYER.vy = Math.max(PLAYER.vy, INPUT.stompDashSpeed * 0.86);
          corrected = true;
          continue;
        }

        if (p.type === TYPE.SPIKE && laserBeamOverlap(PLAYER.x, PLAYER.y, radius, p)) {
          beginDeath("You touched a laser.");
          return;
        }

        if (!circleRectOverlap(PLAYER.x, PLAYER.y, radius, p, false)) continue;

        const leftPen = Math.abs((PLAYER.x + radius) - p.x);
        const rightPen = Math.abs((p.x + p.w) - (PLAYER.x - radius));
        const topPen = Math.abs((PLAYER.y + radius) - p.y);
        const bottomPen = Math.abs((p.y + p.h) - (PLAYER.y - radius));

        const minPen = Math.min(leftPen, rightPen, topPen, bottomPen);

        if (minPen === leftPen) {
          PLAYER.x = p.x - radius - skin;
          PLAYER.targetX = PLAYER.x;
        } else if (minPen === rightPen) {
          PLAYER.x = p.x + p.w + radius + skin;
          PLAYER.targetX = PLAYER.x;
        } else if (minPen === topPen) {
          PLAYER.y = p.y - radius;
          if (PLAYER.vy > 0) PLAYER.vy = -PLAYER.jumpVelocity;
          PLAYER.lastBouncePlatformId = p.id;
          p.bounceVel += 1.25;
          p.wobbleVel += clamp((PLAYER.x - (p.x + p.w * 0.5)) / (p.w * 0.5), -1, 1) * 3.8;
        } else {
          PLAYER.y = p.y + p.h + radius + skin;
          if (PLAYER.vy < 0) PLAYER.vy = 0;
        }

        PLAYER.prevX = PLAYER.x;
        PLAYER.prevY = PLAYER.y;
        corrected = true;
      }

      if (!corrected) break;
    }
  }


  // PHASE-1
  // EZME ARTIK SADECE HIZLI AŞAĞI FLICK İLE TETİKLENİR.
  function squashEnemy(enemy) {
    if (!enemy || !enemy.active || enemy.squashed) return false;

    enemy.squashed = true;
    enemy.active = false;
    enemy.squashTimer = 0;

    // Preserve the existing successful-stomp result.
    PLAYER.y = enemy.y - enemy.radius - PLAYER.radius + 1;
    PLAYER.prevY = PLAYER.y;
    PLAYER.vy = -PLAYER.jumpVelocity;
    PLAYER.lastBouncePlatformId = enemy.platformRef?.id ?? null;
    PLAYER.squash = Math.max(PLAYER.squash, 0.24);
    PLAYER.stretch = -0.03;

    const bonus = 30;
    STATE.score += bonus;
    STATE.combo += 1;
    STATE.speedPulse = Math.max(STATE.speedPulse, 0.10);
    STATE.impactShake = Math.max(STATE.impactShake, 1.3);

    ParticleSys.spawn(enemy.x, enemy.y, {
      count: 12,
      color: "#6e8f62",
      speedMin: 44,
      speedMax: 112,
      lift: 34,
      lifeMin: 0.26,
      lifeMax: 0.48,
      sizeMin: 2,
      sizeMax: 4.5
    });

    // Second, hotter burst for a tiny burn/explosion feel.
    ParticleSys.spawn(enemy.x, enemy.y - 2, {
      count: 7,
      color: "#f19a46",
      speedMin: 28,
      speedMax: 86,
      lift: 52,
      lifeMin: 0.20,
      lifeMax: 0.38,
      sizeMin: 1.5,
      sizeMax: 3.4
    });

    popup(`+${bonus}`, enemy.x, enemy.y - 20, "good");
    AudioSys.squash();
    updateHUD();

    return true;
  }

  function findEnemyInFlickRange() {
    const range = PLAYER.radius * CONFIG.controls.flickEnemyRangeMul;
    let best = null;
    let bestDistSq = Infinity;

    for (const enemy of STATE.enemies) {
      if (!enemy.active || enemy.squashed) continue;

      const dx = enemy.x - PLAYER.x;
      const dy = enemy.y - PLAYER.y;

      // Generous area around/below the player. Do not grab enemies far above.
      if (dy < -PLAYER.radius * 0.6 || dy > range) continue;
      if (Math.abs(dx) > range) continue;

      const distSq = dx * dx + dy * dy;
      if (distSq <= range * range && distSq < bestDistSq) {
        best = enemy;
        bestDistSq = distSq;
      }
    }

    return best;
  }

  function triggerDownFlick() {
    if (STATE.mode !== MODE.PLAYING) return;

    INPUT.flickPulse = 1;
    INPUT.stompDashTimer = INPUT.stompDashDuration;
    INPUT.stompDashRamp = 0;
    INPUT.stompDashActive = true;
    INPUT.stompFragileBroken = false;
    INPUT.angryFaceTimer = 0.42;

    // Lock the nearest eligible enemy only as a stomp target hint.
    // The enemy is NOT killed until the ball actually reaches it.
    const enemy = findEnemyInFlickRange();
    INPUT.stompTargetId = enemy ? enemy.id : null;

    PLAYER.squash = Math.max(PLAYER.squash, 0.20);
    PLAYER.stretch = Math.max(PLAYER.stretch, 0.14);
    PLAYER.vy = Math.max(PLAYER.vy, 520);

    if (navigator.vibrate) {
      try { navigator.vibrate(IS_MOBILE ? 22 : 15); } catch (_) {}
    }

    // No enemy in range => still perform the short dive, with no score penalty.
  }

  function checkEnemyContact() {
    if (STATE.mode !== MODE.PLAYING) return;

    for (const enemy of STATE.enemies) {
      if (!enemy.active || enemy.squashed) continue;

      const dx = PLAYER.x - enemy.x;
      const dy = PLAYER.y - enemy.y;
